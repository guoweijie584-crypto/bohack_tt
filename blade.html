<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>百刃 · BLADE ORBIT 500</title>
<style>
:root{--bg:#06070d;--ink:#f5f1e6;--muted:#9b9ab0;--gold:#f0c96b;--cyan:#6fe6df;--red:#ff6b7a;--line:#2c2a3c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0;outline:0}
.hidden{display:none !important}
.stage-wrap{position:absolute;inset:0;overflow:hidden;
  width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));margin:auto}
canvas#cv{display:block;width:100%;height:100%;background:#06070d;touch-action:none}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;gap:6px;padding:8px 12px;z-index:4}
.topbar button{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;color:var(--muted);
  background:rgba(16,18,28,.84);border:1px solid var(--line)}
.topbar button:hover{color:var(--gold);border-color:var(--gold)}
.bottombar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;z-index:4}
.bbtn{padding:11px 18px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
#skillBtn{color:#17130a;background:linear-gradient(145deg,#f4d78c,#c99a3c);
  box-shadow:0 8px 24px rgba(240,201,107,.28);border:1px solid #ffe6a8}
#skillBtn.cool{color:#8b8ba0;background:rgba(20,22,34,.9);border-color:var(--line);box-shadow:none}
#skillBtn.on{color:#0d2020;background:linear-gradient(145deg,#a8fff2,#3fc9bd);border-color:#c8fff8;
  box-shadow:0 8px 28px rgba(111,230,223,.45)}
#shopBtn{color:#f5e9c8;background:linear-gradient(145deg,#2f3448,#1a1d2b);border:1px solid var(--gold)}
#shopBtn:hover{background:linear-gradient(145deg,#3c4159,#22263a)}
.hint{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;
  color:rgba(155,154,176,.62);z-index:3;pointer-events:none}
#stick{display:none;position:absolute;left:20px;bottom:70px;width:118px;height:118px;border-radius:50%;z-index:4;
  background:rgba(18,20,32,.55);border:1.5px solid rgba(111,230,223,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  background:rgba(111,230,223,.55);border:1.5px solid #bffff8;pointer-events:none}
@media (pointer:coarse),(max-width:820px){#stick{display:block}}
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(3,4,9,.84);backdrop-filter:blur(5px);padding:18px}
.modal{width:min(460px,100%);max-height:94%;overflow:auto;padding:24px 26px;border-radius:17px;text-align:center;
  background:linear-gradient(160deg,#1a1a28,#0b0c14);border:1px solid var(--line);
  box-shadow:0 24px 70px rgba(0,0,0,.75);animation:pop .25s ease both}
.modal.wide{width:min(740px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.modal h2{font-size:27px;letter-spacing:3px;margin-bottom:6px;color:var(--gold);text-shadow:0 0 24px rgba(240,201,107,.4)}
.modal .sub{font-size:11px;color:var(--muted);line-height:1.85;margin-bottom:16px}
.wlist{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.wcard{padding:8px 6px 10px;border-radius:11px;border:1.5px solid var(--line);background:rgba(255,255,255,.03);
  cursor:pointer;transition:.15s}
.wcard:hover{border-color:var(--cyan)}
.wcard.sel{border-color:var(--gold);background:rgba(240,201,107,.10);box-shadow:0 0 18px rgba(240,201,107,.18)}
.wcard canvas{display:block;width:100%;height:76px}
.wcard b{display:block;font-size:13px;color:var(--ink);margin-top:2px}
.wcard span{display:block;font-size:10px;color:var(--muted);line-height:1.5}
.primary{padding:12px 34px;border-radius:11px;font-size:15px;font-weight:800;
  color:#17130a;background:linear-gradient(145deg,#f4d78c,#c99a3c)}
.ghost{padding:11px 24px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);
  background:rgba(255,255,255,.05);border:1px solid var(--line);margin-left:8px}
.shop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  font-size:12px;color:var(--muted)}
.shop-head b{font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.slist{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;text-align:left}
.sitem{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.035);cursor:pointer}
.sitem:hover{border-color:var(--gold)}
.sitem.no{opacity:.45;cursor:not-allowed}
.sitem .n{font-size:13px;font-weight:800;color:var(--ink)}
.sitem .tag{float:right;font-size:9px;padding:2px 6px;border-radius:5px;font-weight:700}
.tag.atk{background:rgba(255,107,122,.18);color:#ff9aa5}
.tag.def{background:rgba(111,230,223,.18);color:#9ff3ec}
.tag.sup{background:rgba(240,201,107,.18);color:var(--gold)}
.sitem .d{font-size:10px;color:var(--muted);line-height:1.55;margin-top:4px}
.sitem .p{font-size:11px;font-weight:800;color:var(--gold);margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;text-align:left}
.stat-box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:10px;color:var(--muted)}
.stat-box b{display:block;font-size:17px;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div class="stage-wrap">
  <canvas id="cv" width="960" height="540"></canvas>

  <div class="topbar">
    <button id="soundBtn">音效：开</button>
    <button id="restartBtn">重开</button>
  </div>

  <div class="bottombar">
    <button id="shopBtn" class="bbtn">补给站 · 0 金币 [B]</button>
    <button id="skillBtn" class="bbtn">巨刃化 · 变大 [空格]</button>
  </div>
  <div class="hint">WASD 移动 · 打碎木栅栏得刀片 · 打怪消耗 2 把刀换金币 · B 商店 · 1~4 切换刀片样式 · 怪物可穿过刀阵</div>

  <div id="stick"><div id="knob"></div></div>

  <!-- 开机：只选刀片样式，不选择角色 -->
  <div id="startOverlay" class="overlay">
    <div class="modal wide">
      <h2>百刃 · 选择刀片</h2>
      <p class="sub">固定角色，无需选人。刀片围绕身体旋转，尺寸刻意做小。<br>
        <b style="color:#e8c98a">打碎木栅栏 → 获得刀片</b>（最多 500 把）·
        <b style="color:#9ff3ec">击杀怪物 → 少 2 把刀，但得到金币</b><br>
        金币可在补给站兑换进攻 / 防御设施。怪物不会被刀片阻挡，会直接冲到你身边。<br>
        地图分为<b style="color:#9ff3ec">旧港货场 · 铁轨区 · 废车场 · 中央广场</b>四大区域，地标仅作装饰，不阻挡移动。</p>
      <div id="weaponList" class="wlist"></div>
      <button id="startBtn" class="primary">开始割草</button>
    </div>
  </div>

  <!-- 金币商店 -->
  <div id="shopOverlay" class="overlay hidden">
    <div class="modal wide">
      <h2>补给站</h2>
      <div class="shop-head"><span>击杀怪物赚金币 · 兑换设施会随购买次数涨价</span><span>金币 <b id="shopGold">0</b></span></div>
      <div id="shopList" class="slist"></div>
      <button id="closeShopBtn" class="primary">返回战场 [B]</button>
    </div>
  </div>

  <div id="resultOverlay" class="overlay hidden">
    <div class="modal">
      <h2 id="resultTitle">战斗结束</h2>
      <p class="sub" id="resultSub"></p>
      <div class="stats" id="resultStats"></div>
      <button id="againBtn" class="primary">再来一局</button>
      <button id="backBtn" class="ghost">换刀片</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   百刃 BLADE ORBIT 500 — 2D 割草
   固定角色 · 开机只选刀片样式 · 唯一主动技能「变大」
   木栅栏 → 刀片(上限500) · 击杀怪 → -2刀 +金币 · 金币 → 攻/防设施
   stepFrame 纯逻辑、render 单独绘制，便于 Node vm 完整验证
   ============================================================ */
var W=960,H=540,STEP=1000/60,TAU=Math.PI*2;
var WORLD_W=5200,WORLD_H=3900;      // 更大的地图
var START_BLADES=3,MAX_BLADES=500,KILL_COST=2,FENCE_GAIN=5;
var SKILL_CD=840,SKILL_DUR=360,SPEED=3.15;
var MAX_MONSTERS=180,MAX_FENCES=340,MAX_PARTICLES=420,MAX_POPS=26;
var MAX_BUILDINGS=18,MAX_BULLETS=90,MAX_RINGS=8;

var WEAPONS=[
  {id:'short',   name:'短刃',  L:9,  dmg:1.00,spin:1.00,shape:'blade',desc:'均衡 · 轻快'},
  {id:'spear',   name:'长枪',  L:13, dmg:1.35,spin:0.86,shape:'spear',desc:'细长 · 高伤'},
  {id:'shuriken',name:'手里剑',L:8,  dmg:0.82,spin:1.38,shape:'star', desc:'小巧 · 高速'},
  {id:'axe',     name:'飞斧',  L:10, dmg:1.20,spin:0.94,shape:'axe',  desc:'宽刃 · 重击'}
];
var WEAPON_BY_ID={};for(var wi=0;wi<WEAPONS.length;wi++)WEAPON_BY_ID[WEAPONS[wi].id]=WEAPONS[wi];

var SHOP=[
  {id:'turret', name:'自动炮台',   type:'atk',tag:'进攻',cost:65, desc:'在身边部署炮台，自动锁定最近的怪物开火（60 秒）'},
  {id:'bladeup',name:'刃锋淬炼',   type:'atk',tag:'进攻',cost:45, desc:'所有刀片伤害 +18%，永久叠加'},
  {id:'orbit',  name:'扩展刀环',   type:'atk',tag:'进攻',cost:80, desc:'环绕半径 +12%，覆盖更大范围（有上限）'},
  {id:'field',  name:'减速力场',   type:'def',tag:'防御',cost:55, desc:'部署力场，范围内怪物移速 -45%（50 秒）'},
  {id:'shield', name:'护盾发生器', type:'def',tag:'防御',cost:70, desc:'立即获得 45 点可吸收伤害的护盾'},
  {id:'repair', name:'应急修复',   type:'def',tag:'防御',cost:35, desc:'立即回复 35 点 HP'},
  {id:'supply', name:'刀片补给',   type:'sup',tag:'补给',cost:25, desc:'立即补充 20 把刀（刀不够时救命）'}
];
var SHOP_BY_ID={};for(var si=0;si<SHOP.length;si++)SHOP_BY_ID[SHOP[si].id]=SHOP[si];

var MTYPE={
  grunt: {hp:24, r:15,speed:1.05,color:'#6fe6df',dmg:5, gold:6 },
  runner:{hp:16, r:11,speed:1.90,color:'#b99bff',dmg:4, gold:8 },
  tank:  {hp:76, r:23,speed:0.70,color:'#ffab6b',dmg:9, gold:16},
  elite: {hp:230,r:30,speed:0.95,color:'#ff6b7a',dmg:13,gold:40}
};
var AREAS=[
  {x:0,y:0,w:WORLD_W/2,h:WORLD_H/2,name:'旧港货场',tint:'rgba(111,230,223,.030)',edge:'rgba(111,230,223,.20)'},
  {x:WORLD_W/2,y:0,w:WORLD_W/2,h:WORLD_H/2,name:'铁轨区',tint:'rgba(240,201,107,.030)',edge:'rgba(240,201,107,.20)'},
  {x:0,y:WORLD_H/2,w:WORLD_W/2,h:WORLD_H/2,name:'废车场',tint:'rgba(185,155,255,.030)',edge:'rgba(185,155,255,.20)'},
  {x:WORLD_W/2,y:WORLD_H/2,w:WORLD_W/2,h:WORLD_H/2,name:'中央广场',tint:'rgba(255,107,122,.028)',edge:'rgba(255,107,122,.20)'}
];

var SEL={wi:0};
var B=null,held={},touchMove={x:0,y:0},soundOn=true,audioCtx=null;
var D={},c2d=null,lastTs=0,acc=0,CAM={x:0,y:0};

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function dist2(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}

/* ---------- 音效 ---------- */
function sfx(kind){
  if(!soundOn||typeof window==='undefined')return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var cfg={kill:[520,.06,'triangle'],hurt:[130,.16,'square'],skill:[210,.32,'sawtooth'],
      wood:[160,.09,'square'],coin:[760,.11,'sine'],buy:[620,.18,'triangle'],
      up:[720,.20,'sine'],win:[880,.42,'triangle'],ko:[90,.40,'triangle']}[kind];
    if(!cfg)return;
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,cfg[0]*.5),audioCtx.currentTime+cfg[1]);
    g.gain.setValueAtTime(.035,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+cfg[1]);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+cfg[1]);
  }catch(e){}
}

/* ---------- 状态 ---------- */
function setBanner(text,color,life){B.banner={text:text,color:color||'#f0c96b',life:life||110,max:life||110};}
function startGame(){
  B={
    phase:'play',frame:0,kills:0,score:0,gold:0,fencesBroken:0,
    blades:START_BLADES,peakBlades:START_BLADES,bladesDirty:false,hundred:false,
    px:WORLD_W/2,py:WORLD_H/2,vx:0,vy:0,face:-Math.PI/2,
    hp:180,maxHp:180,shield:0,invuln:0,
    wIdx:SEL.wi,angle:0,slots:[],bladeXY:[],bladeL:9,maxBladeR:70,
    orbitMul:1,orbitBonus:0,dmgMul:1,
    monsters:[],fences:[],buildings:[],bullets:[],particles:[],pops:[],
    spawnCd:40,wave:1,waveFrames:0,elitePending:0,
    skillCd:0,enlargeFrames:0,bought:{},shopOpen:false,
    banner:null,shake:0,shownResult:false,hitFlash:0
  };
  CAM.x=clamp(B.px-W/2,0,WORLD_W-W);
  CAM.y=clamp(B.py-H/2,0,WORLD_H-H);
  held={};touchMove={x:0,y:0};
  rebuildBlades();computeBladePositions();
  for(var i=0;i<42;i++)spawnFenceGroup(true);
  setBanner('开局 · 3 把刀，去拆木栅栏','#6fe6df',120);
  return B;
}

/* ---------- 刀片环 ---------- */
function rebuildBlades(){
  var n=B.blades,rings=clamp(Math.ceil(n/64),1,MAX_RINGS);
  B.rings=rings;B.slots.length=0;
  var base=Math.floor(n/rings),extra=n%rings;
  for(var r=0;r<rings;r++){
    var cnt=base+(r<extra?1:0);
    for(var i=0;i<cnt;i++)B.slots.push({ring:r,ang:i/cnt*TAU+(r%2?Math.PI/cnt:0)});
  }
}
function computeBladePositions(){
  var w=WEAPONS[B.wIdx],big=B.enlargeFrames>0;
  // 刀越多刀环越宽：拆栅栏更快，形成滚雪球式的正反馈
  var base=clamp((62+B.blades*0.028+B.orbitBonus)*B.orbitMul,48,108);
  var R=base*(big?1.35:1);
  // 刀越多每把越小，500 把也不会糊成一团
  var scale=1-Math.min(.30,B.blades/MAX_BLADES*.30);
  B.bladeL=w.L*scale*(big?1.35:1);
  B.maxBladeR=R*(1+(B.rings-1)*0.18);
  // 记录每圈刀的索引区间与半径：碰撞时先按半径筛圈，500 把刀也只需检查一圈约 64 把
  B.ringStart=[];B.ringEnd=[];B.ringR=[];
  var nb=Math.floor(B.slots.length/B.rings),ex=B.slots.length%B.rings,idx=0;
  for(var r=0;r<B.rings;r++){
    var cnt=nb+(r<ex?1:0);
    B.ringStart[r]=idx;B.ringEnd[r]=idx+cnt;B.ringR[r]=R*(1+r*0.18);idx+=cnt;
  }
  B.bladeXY.length=B.slots.length;
  for(var i=0;i<B.slots.length;i++){
    var s=B.slots[i];
    var a=B.angle*w.spin*(s.ring%2?-0.72:1)+s.ang;
    var rr=B.ringR[s.ring];
    B.bladeXY[i]={x:B.px+Math.cos(a)*rr,y:B.py+Math.sin(a)*rr,a:a,ring:s.ring};
  }
}
// 目标是否碰到任意一把刀：先按「目标到玩家的半径」排除不可能相交的刀环
function bladeTouches(x,y,rad){
  var dx=x-B.px,dy=y-B.py,d=Math.sqrt(dx*dx+dy*dy);
  for(var r=0;r<B.ringStart.length;r++){
    if(Math.abs(d-B.ringR[r])>rad)continue;
    for(var i=B.ringStart[r];i<B.ringEnd[r];i++){
      var bp=B.bladeXY[i];
      if(dist2(x,y,bp.x,bp.y)<rad*rad)return true;
    }
  }
  return false;
}
function addBlades(n){
  var before=B.blades;
  B.blades=clamp(B.blades+n,0,MAX_BLADES);
  if(B.blades>B.peakBlades)B.peakBlades=B.blades;
  if(B.blades!==before)B.bladesDirty=true;
  // 已满刃时拆栅栏不浪费，折算成金币
  if(before+n>MAX_BLADES)B.gold+=3;
  if(B.blades>=MAX_BLADES&&!B.hundred){
    B.hundred=true;setBanner('五百刃达成 · 500 / 500！','#ffd166',220);sfx('win');
    burst(B.px,B.py,'#ffd166',70,6);
  }else if(B.blades>=50&&Math.floor(before/50)!==Math.floor(B.blades/50)){
    setBanner(B.blades+' 把刀！','#6fe6df',70);
  }
}
function spendBlades(n){
  // 至少留 1 把核心刀，避免刀耗尽后无法再拆栅栏造成死锁
  var before=B.blades;
  B.blades=Math.max(1,B.blades-n);
  if(B.blades!==before)B.bladesDirty=true;
}
function useSkill(){
  if(!B||B.phase!=='play'||B.skillCd>0||B.shopOpen)return false;
  B.enlargeFrames=SKILL_DUR;B.skillCd=SKILL_CD;
  setBanner('巨刃化 · 变大！','#ffd166',100);sfx('skill');return true;
}
function switchWeapon(i){
  if(i<0||i>=WEAPONS.length)return false;
  SEL.wi=i;
  if(B){B.wIdx=i;B.bladesDirty=true;setBanner('刀片切换 · '+WEAPONS[i].name,'#6fe6df',70);}
  return true;
}

/* ---------- 木栅栏 ---------- */
function spawnFenceGroup(initial){
  if(B.fences.length>=MAX_FENCES)return;
  var a=rnd(0,TAU);
  // 初始：一部分栅栏就在刀圈边（站着不动也能拆），另一部分铺满大地图供探索
  // 补充：集中在刀环内沿到外沿，刀片自动收割，避免「杀怪扣刀→刀枯竭→死亡」的死循环
  var M=MAPS[B.mapIdx];
  // 初始栅栏铺满大地图供探索；补充栅栏落在刀环带内，站着也能持续收割
  var rad=initial?rnd(M.far[0],M.far[1]):rnd(M.near[0],M.near[1]);
  var cx=clamp(B.px+Math.cos(a)*rad,60,WORLD_W-60);
  var cy=clamp(B.py+Math.sin(a)*rad,60,WORLD_H-60);
  var n=3+Math.floor(Math.random()*4),dir=rnd(0,TAU),gap=32;
  for(var i=0;i<n;i++){
    if(B.fences.length>=MAX_FENCES)break;
    var x=clamp(cx+Math.cos(dir)*(i-n/2)*gap,40,WORLD_W-40);
    var y=clamp(cy+Math.sin(dir)*(i-n/2)*gap,40,WORLD_H-40);
    B.fences.push({x:x,y:y,hp:22,maxHp:22,r:17,hitCd:0,flash:0,rot:dir+Math.PI/2});
  }
}
function breakFence(fi){
  var f=B.fences[fi];B.fences.splice(fi,1);
  B.fencesBroken++;B.score+=5;
  addBlades(FENCE_GAIN);B.gold+=2;
  burst(f.x,f.y,'#c89355',12,3.4);
  pop(f.x,f.y,'+'+FENCE_GAIN+' 刃','#f0c96b');
  sfx('wood');
}

/* ---------- 怪物 ---------- */
function spawnMonster(){
  if(B.monsters.length>=MAX_MONSTERS)return;
  var pick=Math.random(),type;
  if(B.elitePending>0){B.elitePending--;type='elite';}
  else type=pick<0.58?'grunt':pick<0.81?'runner':pick<0.96?'tank':'elite';
  var t=MTYPE[type],a=rnd(0,TAU),rad=rnd(600,820);
  var hp=Math.round(t.hp*(1+(B.wave-1)*0.20));
  B.monsters.push({
    x:clamp(B.px+Math.cos(a)*rad,30,WORLD_W-30),
    y:clamp(B.py+Math.sin(a)*rad,30,WORLD_H-30),
    vx:0,vy:0,type:type,r:t.r,hp:hp,maxHp:hp,
    speed:t.speed*(1+(B.wave-1)*0.03),color:t.color,dmg:t.dmg,gold:t.gold,
    hitCd:0,flash:0,wob:rnd(0,TAU)
  });
}
function burst(x,y,color,n,spread){
  for(var i=0;i<n;i++){
    if(B.particles.length>=MAX_PARTICLES)break;
    var a=rnd(0,TAU),s=rnd(.5,spread||3.2);
    B.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:rnd(16,34),max:34,size:rnd(1.5,4),color:color});
  }
}
function pop(x,y,text,color){
  if(B.pops.length>=MAX_POPS)B.pops.shift();
  B.pops.push({x:x,y:y,text:text,color:color,life:46,max:46});
}
function damageMonster(mi,dmg){
  var m=B.monsters[mi];
  m.hp-=dmg;m.flash=4;m.hitCd=8;
  if(m.hp<=0)killMonster(mi);
}
function killMonster(mi){
  var m=B.monsters[mi];B.monsters.splice(mi,1);
  B.kills++;B.score+=m.gold;B.gold+=m.gold;
  spendBlades(KILL_COST);                    // 打怪不增加刀数，反而少 2 把
  burst(m.x,m.y,m.color,m.type==='elite'?22:8,m.type==='elite'?5:3);
  pop(m.x,m.y,'+'+m.gold+' 金币','#ffd166');
  if(B.kills%25===0)B.elitePending+=3;
  // 成长仍是「变大」，但只扩刀环不加刀身，保证刀片始终小巧
  if(B.kills%20===0&&B.orbitBonus<60){
    B.orbitBonus+=6;
    setBanner('刀环扩张 · 范围变大','#ffd166',95);sfx('up');
    burst(B.px,B.py,'#ffd166',18,4);
  }
  sfx('kill');sfx('coin');
}

/* ---------- 金币商店 ---------- */
function itemCost(it){return Math.round(it.cost*(1+0.4*(B.bought[it.id]||0)));}
function buyItem(id){
  if(!B||B.phase!=='play')return false;
  var it=SHOP_BY_ID[id];if(!it)return false;
  var cost=itemCost(it);
  if(B.gold<cost)return false;
  B.gold-=cost;B.bought[id]=(B.bought[id]||0)+1;
  if(id==='turret'){
    placeBuilding('turret');
  }else if(id==='field'){
    placeBuilding('field');
  }else if(id==='shield'){
    B.shield=clamp(B.shield+45,0,180);placeBuilding('shield');
  }else if(id==='bladeup'){
    B.dmgMul*=1.18;
  }else if(id==='orbit'){
    B.orbitMul=Math.min(1.6,B.orbitMul*1.12);
  }else if(id==='repair'){
    B.hp=Math.min(B.maxHp,B.hp+35);
  }else if(id==='supply'){
    addBlades(20);
  }
  setBanner('已兑换 · '+it.name,'#ffd166',85);sfx('buy');
  return true;
}
function placeBuilding(kind){
  if(B.buildings.length>=MAX_BUILDINGS)return;
  var a=rnd(0,TAU),r=rnd(70,150);
  B.buildings.push({kind:kind,
    x:clamp(B.px+Math.cos(a)*r,20,WORLD_W-20),
    y:clamp(B.py+Math.sin(a)*r,20,WORLD_H-20),
    life:kind==='shield'?1200:kind==='field'?3000:3600,
    max:kind==='shield'?1200:kind==='field'?3000:3600,
    cd:0,r:kind==='field'?210:0,t:rnd(0,TAU)});
}

/* ---------- 每帧逻辑（纯逻辑） ---------- */
function stepFrame(){
  if(!B||B.phase!=='play'||B.shopOpen)return;
  B.frame++;
  var ix=(held.right?1:0)-(held.left?1:0)+touchMove.x;
  var iy=(held.down?1:0)-(held.up?1:0)+touchMove.y;
  var il=Math.sqrt(ix*ix+iy*iy);
  if(il>1){ix/=il;iy/=il;}
  B.vx=ix*SPEED;B.vy=iy*SPEED;
  B.px=clamp(B.px+B.vx,34,WORLD_W-34);
  B.py=clamp(B.py+B.vy,34,WORLD_H-34);
  if(il>0.05)B.face=Math.atan2(iy,ix);

  if(B.invuln>0)B.invuln--;
  if(B.hitFlash>0)B.hitFlash--;
  if(B.skillCd>0)B.skillCd--;
  if(B.enlargeFrames>0)B.enlargeFrames--;
  if(B.shake>0)B.shake--;
  if(B.banner&&--B.banner.life<=0)B.banner=null;

  B.angle+=0.052;
  computeBladePositions();

  B.waveFrames++;
  if(B.waveFrames>=1500){B.waveFrames=0;B.wave++;setBanner('第 '+B.wave+' 波 · 怪潮增强','#ff9a6b',90);}

  // 怪物生成
  if(--B.spawnCd<=0){
    var batch=1+Math.floor((B.wave-1)/2)+Math.floor(B.kills/80);
    if(batch>5)batch=5;
    for(var b=0;b<batch;b++)spawnMonster();
    var spawnFloor=B.wave<=2?22:12;   // 前两波留足攒刀时间，避免开局被怪潮压死
    B.spawnCd=Math.max(spawnFloor,42-(B.wave-1)*3-Math.floor(B.kills/45));
  }
  // 栅栏持续补充，保证刀片来源不断
  if(B.frame%240===0&&B.fences.length<240){
    for(var fg=0;fg<6;fg++)spawnFenceGroup(false);
  }

  // 设施：炮台开火 / 到期移除
  for(var ki=B.buildings.length-1;ki>=0;ki--){
    var bd=B.buildings[ki];bd.life--;
    if(bd.life<=0){B.buildings.splice(ki,1);continue;}
    if(bd.kind==='turret'&&--bd.cd<=0){
      bd.cd=26;
      var best=-1,bd2=430*430;
      for(var mj=0;mj<B.monsters.length;mj++){
        var dd=dist2(B.monsters[mj].x,B.monsters[mj].y,bd.x,bd.y);
        if(dd<bd2){bd2=dd;best=mj;}
      }
      if(best>=0&&B.bullets.length<MAX_BULLETS){
        var tg=B.monsters[best],dl=Math.sqrt(bd2)||1;
        B.bullets.push({x:bd.x,y:bd.y,vx:(tg.x-bd.x)/dl*7,vy:(tg.y-bd.y)/dl*7,
          life:70,dmg:16,color:'#ffd166'});
      }
    }
  }
  // 子弹
  for(var bi2=B.bullets.length-1;bi2>=0;bi2--){
    var bl=B.bullets[bi2];bl.x+=bl.vx;bl.y+=bl.vy;bl.life--;
    var gone=bl.life<=0;
    if(!gone){
      for(var mm=B.monsters.length-1;mm>=0;mm--){
        if(dist2(bl.x,bl.y,B.monsters[mm].x,B.monsters[mm].y)<(B.monsters[mm].r+9)*(B.monsters[mm].r+9)){
          damageMonster(mm,bl.dmg);gone=true;break;
        }
      }
    }
    if(gone)B.bullets.splice(bi2,1);
  }

  var w=WEAPONS[B.wIdx],big=B.enlargeFrames>0;
  var reach=B.bladeL*0.95+5;
  var dmg=(7+B.orbitBonus*0.05)*w.dmg*B.dmgMul*(big?1.8:1);
  // 刀越多单体伤害越高（只作用于怪物，栅栏仍用 dmg，成长曲线不受影响）
  var mdmg=dmg*(1+B.blades*0.004);
  var near2=(B.maxBladeR+45)*(B.maxBladeR+45);
  var hitPlayer=false;

  // 怪物：持续朝玩家推进，不被刀片阻挡（命中不改速度、不击退）
  for(var mi=B.monsters.length-1;mi>=0;mi--){
    var m=B.monsters[mi];
    if(m.flash>0)m.flash--;
    if(m.hitCd>0)m.hitCd--;
    var dx=B.px-m.x,dy=B.py-m.y,dl=Math.sqrt(dx*dx+dy*dy)||1;
    var spd=m.speed;
    for(var fi2=0;fi2<B.buildings.length;fi2++){
      var fld=B.buildings[fi2];
      if(fld.kind==='field'&&dist2(m.x,m.y,fld.x,fld.y)<fld.r*fld.r){spd*=0.55;break;}
    }
    var wob=Math.sin(B.frame*0.045+m.wob)*0.22;
    m.x+=(dx/dl*Math.cos(wob)-dy/dl*Math.sin(wob))*spd+m.vx;
    m.y+=(dy/dl*Math.cos(wob)+dx/dl*Math.sin(wob))*spd+m.vy;
    m.vx*=0.86;m.vy*=0.86;
    m.x=clamp(m.x,20,WORLD_W-20);m.y=clamp(m.y,20,WORLD_H-20);

    if(m.hitCd<=0&&dist2(m.x,m.y,B.px,B.py)<near2){
      if(bladeTouches(m.x,m.y,reach+m.r))damageMonster(mi,mdmg);
    }
    if(!hitPlayer&&B.monsters[mi]===m&&B.invuln<=0&&
       dist2(m.x,m.y,B.px,B.py)<(m.r+13)*(m.r+13)){
      var hurt=m.dmg*0.6+(B.wave-1)*0.4;
      if(B.shield>0){var ab=Math.min(B.shield,hurt);B.shield-=ab;hurt-=ab;}
      B.hp-=hurt;B.invuln=42;B.hitFlash=10;B.shake=9;
      burst(B.px,B.py,'#ff6b7a',10,3);sfx('hurt');hitPlayer=true;
    }
  }

  // 木栅栏：刀片可击碎，不阻挡任何单位移动
  for(var fi=B.fences.length-1;fi>=0;fi--){
    var f=B.fences[fi];
    if(f.flash>0)f.flash--;
    if(f.hitCd>0)f.hitCd--;
    if(dist2(f.x,f.y,B.px,B.py)>near2)continue;
    if(f.hitCd>0)continue;
    if(bladeTouches(f.x,f.y,reach+f.r)){
      f.hp-=dmg;f.hitCd=8;f.flash=5;
      if(f.hp<=0)breakFence(fi);
      else if(Math.random()<0.3)burst(f.x,f.y,'#c89355',2,1.5);
    }
  }

  // 帧末统一重建刀环，避免遍历中数组变化
  if(B.bladesDirty){
    B.bladesDirty=false;rebuildBlades();computeBladePositions();
  }

  for(var pi=B.particles.length-1;pi>=0;pi--){
    var q=B.particles[pi];q.x+=q.vx;q.y+=q.vy;q.vx*=0.94;q.vy*=0.94;q.life--;
    if(q.life<=0)B.particles.splice(pi,1);
  }
  for(var oi=B.pops.length-1;oi>=0;oi--){
    var o=B.pops[oi];o.y-=0.55;o.life--;
    if(o.life<=0)B.pops.splice(oi,1);
  }

  var tx=clamp(B.px-W/2,0,WORLD_W-W),ty=clamp(B.py-H/2,0,WORLD_H-H);
  CAM.x+=(tx-CAM.x)*0.14;CAM.y+=(ty-CAM.y)*0.14;
  if(B.hp<=0){B.hp=0;B.phase='over';sfx('ko');}
}

/* ---------- 绘制 ---------- */
function hash2(x,y,s){
  var h=((x*374761393+y*668265263+s*2246822519)|0);
  h=(h^(h>>>13))*1274126177|0;
  return ((h^(h>>>16))>>>0)/4294967296;
}
function areaName(x,y){
  for(var i=0;i<AREAS.length;i++){
    var A=AREAS[i];
    if(x>=A.x&&x<A.x+A.w&&y>=A.y&&y<A.y+A.h)return A.name;
  }
  return '边界地带';
}
// 每个区域一套固定地标（由坐标哈希生成，不随机闪烁），纯装饰、无碰撞
function drawAreaDecor(c,ai,A){
  var gs=300;
  var i0=Math.max(0,Math.floor((CAM.x-A.x)/gs)),i1=Math.min(Math.floor(A.w/gs),Math.floor((CAM.x+W-A.x)/gs));
  var j0=Math.max(0,Math.floor((CAM.y-A.y)/gs)),j1=Math.min(Math.floor(A.h/gs),Math.floor((CAM.y+H-A.y)/gs));
  for(var gx=i0;gx<=i1;gx++)for(var gy=j0;gy<=j1;gy++){
    var r=hash2(gx,gy,ai),r2=hash2(gy,gx,ai+7);
    var x=A.x+gx*gs+40+r*gs*0.7-CAM.x, y=A.y+gy*gs+40+r2*gs*0.7-CAM.y;
    if(x<-110||x>W+110||y<-110||y>H+110)continue;
    c.save();c.translate(x,y);c.rotate((r-0.5)*0.5);c.globalAlpha=.72;
    if(ai===0){                                   // 旧港货场 · 集装箱
      c.fillStyle='rgba(111,230,223,.075)';c.strokeStyle='rgba(111,230,223,.24)';c.lineWidth=2;
      c.fillRect(-42,-22,84,44);c.strokeRect(-42,-22,84,44);
      c.beginPath();for(var k=-28;k<=28;k+=14){c.moveTo(k,-22);c.lineTo(k,22);}c.stroke();
    }else if(ai===1){                            // 铁轨区 · 枕木
      c.strokeStyle='rgba(240,201,107,.24)';c.lineWidth=3;
      c.beginPath();c.moveTo(-90,-16);c.lineTo(90,-16);c.moveTo(-90,16);c.lineTo(90,16);c.stroke();
      c.lineWidth=5;c.beginPath();
      for(var t=-90;t<=90;t+=22){c.moveTo(t,-26);c.lineTo(t,26);}c.stroke();
    }else if(ai===2){                            // 废车场 · 车壳
      c.fillStyle='rgba(185,155,255,.075)';c.strokeStyle='rgba(185,155,255,.26)';c.lineWidth=2;
      c.beginPath();c.moveTo(-40,14);c.lineTo(-34,-8);c.lineTo(-8,-18);c.lineTo(20,-16);
      c.lineTo(38,0);c.lineTo(40,14);c.closePath();c.fill();c.stroke();
      c.fillStyle='rgba(185,155,255,.20)';
      c.beginPath();c.arc(-24,16,8,0,TAU);c.fill();
      c.beginPath();c.arc(24,16,8,0,TAU);c.fill();
    }else{                                       // 中央广场 · 环形纹样
      c.strokeStyle='rgba(255,107,122,.18)';c.lineWidth=2;
      for(var q=1;q<=3;q++){c.beginPath();c.arc(0,0,q*22,0,TAU);c.stroke();}
      c.beginPath();c.moveTo(-52,0);c.lineTo(52,0);c.moveTo(0,-52);c.lineTo(0,52);c.stroke();
    }
    c.restore();
  }
}
function drawGround(c){
  c.fillStyle='#080a12';c.fillRect(0,0,W,H);
  // 四个地图区域（纯视觉，不阻挡）
  for(var ai=0;ai<AREAS.length;ai++){
    var A=AREAS[ai],sx=A.x-CAM.x,sy=A.y-CAM.y;
    if(sx>W||sy>H||sx+A.w<0||sy+A.h<0)continue;
    c.fillStyle=A.tint;c.fillRect(sx,sy,A.w,A.h);
    drawAreaDecor(c,ai,A);
    c.strokeStyle=A.edge;c.lineWidth=2;c.strokeRect(sx+.5,sy+.5,A.w-1,A.h-1);
    c.fillStyle='rgba(245,241,230,.22)';c.font='bold 30px system-ui';
    c.fillText(A.name,sx+26,sy+52);
  }
  var step=80,major=400;
  var x0=Math.floor(CAM.x/step)*step,x1=CAM.x+W;
  var y0=Math.floor(CAM.y/step)*step,y1=CAM.y+H;
  c.lineWidth=1;
  for(var x=x0;x<=x1;x+=step){
    var px=Math.round(x-CAM.x)+.5;
    c.strokeStyle=(Math.round(x)%major===0)?'rgba(240,201,107,.15)':'rgba(111,230,223,.06)';
    c.beginPath();c.moveTo(px,0);c.lineTo(px,H);c.stroke();
  }
  for(var y=y0;y<=y1;y+=step){
    var py=Math.round(y-CAM.y)+.5;
    c.strokeStyle=(Math.round(y)%major===0)?'rgba(240,201,107,.15)':'rgba(111,230,223,.06)';
    c.beginPath();c.moveTo(0,py);c.lineTo(W,py);c.stroke();
  }
  c.strokeStyle='rgba(240,201,107,.55)';c.lineWidth=3;
  c.strokeRect(-CAM.x+1,-CAM.y+1,WORLD_W-2,WORLD_H-2);
}
function drawFence(c,f){
  var sx=f.x-CAM.x,sy=f.y-CAM.y;
  if(sx<-40||sx>W+40||sy<-40||sy>H+40)return;
  c.save();c.translate(sx,sy);c.rotate(f.rot);
  var dmg=1-f.hp/f.maxHp;
  c.fillStyle=f.flash>0?'#f6dfae':(dmg>0.6?'#7a5836':'#a97b48');
  c.strokeStyle='rgba(40,24,12,.85)';c.lineWidth=1.5;
  c.fillRect(-16,-5,32,10);c.strokeRect(-16,-5,32,10);
  c.fillRect(-16,-13,7,22);c.strokeRect(-16,-13,7,22);
  c.fillRect(9,-13,7,22);c.strokeRect(9,-13,7,22);
  c.fillStyle='rgba(50,30,14,.55)';c.fillRect(-16,-1,32,2);
  c.fillStyle='#d8c08c';c.fillRect(-13,-11,2,2);c.fillRect(11,-11,2,2);
  c.restore();
  if(f.hp<f.maxHp){
    c.fillStyle='rgba(4,5,10,.8)';c.fillRect(sx-16,sy-24,32,3);
    c.fillStyle='#c89355';c.fillRect(sx-16,sy-24,32*clamp(f.hp/f.maxHp,0,1),3);
  }
}
function drawBuilding(c,bd){
  var sx=bd.x-CAM.x,sy=bd.y-CAM.y;
  if(sx<-240||sx>W+240||sy<-240||sy>H+240)return;
  if(bd.kind==='field'){
    c.strokeStyle='rgba(111,230,223,.32)';c.lineWidth=2;
    c.beginPath();c.arc(sx,sy,bd.r,0,TAU);c.stroke();
    c.fillStyle='rgba(111,230,223,.055)';c.fill();
  }
  c.save();c.translate(sx,sy);
  if(bd.kind==='turret'){
    c.fillStyle='#2c3348';c.strokeStyle='#ffd166';c.lineWidth=2;
    c.beginPath();c.arc(0,0,15,0,TAU);c.fill();c.stroke();
    c.fillStyle='#ffd166';c.fillRect(-3,-22,6,16);
    c.fillStyle='rgba(255,209,102,.18)';
    c.beginPath();c.arc(0,0,26+Math.sin(bd.t+bd.life*.05)*3,0,TAU);c.fill();
  }else if(bd.kind==='field'){
    c.fillStyle='#22384a';c.strokeStyle='#6fe6df';c.lineWidth=2;
    c.fillRect(-11,-11,22,22);c.strokeRect(-11,-11,22,22);
    c.fillStyle='#6fe6df';c.beginPath();c.arc(0,0,5,0,TAU);c.fill();
  }else{
    c.strokeStyle='rgba(111,230,223,.5)';c.lineWidth=2;
    c.beginPath();c.arc(0,0,18,0,TAU);c.stroke();
  }
  c.restore();
}
function drawMonster(c,m){
  var sx=m.x-CAM.x,sy=m.y-CAM.y;
  if(sx<-60||sx>W+60||sy<-60||sy>H+60)return;
  var col=m.flash>0?'#ffffff':m.color;
  c.save();c.translate(sx,sy);
  c.globalAlpha=.15;c.fillStyle=m.color;
  c.beginPath();c.arc(0,0,m.r*1.7,0,TAU);c.fill();c.globalAlpha=1;
  c.fillStyle=col;c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=2;c.beginPath();
  if(m.type==='runner'){
    c.moveTo(m.r,0);c.lineTo(-m.r*.8,m.r*.8);c.lineTo(-m.r*.45,0);c.lineTo(-m.r*.8,-m.r*.8);
  }else if(m.type==='tank'){
    for(var k=0;k<6;k++){var a=k/6*TAU+.3;
      if(k===0)c.moveTo(Math.cos(a)*m.r,Math.sin(a)*m.r);
      else c.lineTo(Math.cos(a)*m.r,Math.sin(a)*m.r);}
  }else if(m.type==='elite'){
    for(var k2=0;k2<12;k2++){var a2=k2/12*TAU,rr=k2%2?m.r*.72:m.r;
      if(k2===0)c.moveTo(Math.cos(a2)*rr,Math.sin(a2)*rr);
      else c.lineTo(Math.cos(a2)*rr,Math.sin(a2)*rr);}
  }else c.arc(0,0,m.r,0,TAU);
  c.closePath();c.fill();c.stroke();
  c.fillStyle='rgba(6,8,14,.55)';c.beginPath();c.arc(0,0,m.r*.42,0,TAU);c.fill();
  c.restore();
  if(m.hp<m.maxHp){
    var bw=m.r*2;c.fillStyle='rgba(4,5,10,.8)';c.fillRect(sx-bw/2,sy-m.r-9,bw,4);
    c.fillStyle='#ff6b7a';c.fillRect(sx-bw/2,sy-m.r-9,bw*clamp(m.hp/m.maxHp,0,1),4);
  }
}
function bladeShape(c,shape,L){
  c.beginPath();
  if(shape==='spear'){
    c.moveTo(0,-L*1.55);c.lineTo(L*.20,-L*.62);c.lineTo(L*.11,L*.72);
    c.lineTo(-L*.11,L*.72);c.lineTo(-L*.20,-L*.62);
  }else if(shape==='star'){
    for(var i=0;i<8;i++){
      var a=i/8*TAU-Math.PI/2,rr=i%2?L*.42:L*1.05;
      var qx=Math.cos(a)*rr,qy=Math.sin(a)*rr;
      if(i===0)c.moveTo(qx,qy);else c.lineTo(qx,qy);
    }
  }else if(shape==='axe'){
    c.moveTo(-L*.12,-L*1.0);c.lineTo(L*.95,-L*.82);c.lineTo(L*1.02,L*.52);
    c.lineTo(L*.12,L*.18);c.lineTo(-L*.12,L*.18);
  }else{
    c.moveTo(0,-L*1.22);c.lineTo(L*.36,-L*.30);c.lineTo(L*.15,L*.52);
    c.lineTo(-L*.15,L*.52);c.lineTo(-L*.36,-L*.30);
  }
  c.closePath();
}
function drawWeaponShape(c,w,L,color,angle,cx,cy){
  c.save();c.translate(cx,cy);c.rotate(angle);
  c.fillStyle=color;bladeShape(c,w.shape,L);c.fill();
  c.strokeStyle='rgba(255,255,255,.42)';c.lineWidth=.8;
  c.beginPath();c.moveTo(0,-L*.9);c.lineTo(0,L*.35);c.stroke();
  c.restore();
}
function drawBlades(c){
  var w=WEAPONS[B.wIdx],big=B.enlargeFrames>0,L=B.bladeL;
  var col=big?'#ffd166':w.id==='shuriken'?'#cfe9ff':w.id==='spear'?'#9ff3ec':'#e8e2cf';
  for(var i=0;i<B.bladeXY.length;i++){
    var bp=B.bladeXY[i],sx=bp.x-CAM.x,sy=bp.y-CAM.y;
    if(sx<-30||sx>W+30||sy<-30||sy>H+30)continue;
    drawWeaponShape(c,w,L,bp.ring%2?'#b8f3ee':col,bp.a+Math.PI/2,sx,sy);
  }
}
function drawPlayer(c){
  var x=B.px-CAM.x,y=B.py-CAM.y;
  c.save();c.translate(x,y);
  c.globalAlpha=B.invuln>0?.10:.18;c.fillStyle=B.enlargeFrames>0?'#ffd166':'#6fe6df';
  c.beginPath();c.arc(0,0,26,0,TAU);c.fill();c.globalAlpha=1;
  if(B.enlargeFrames>0){
    c.strokeStyle='rgba(255,209,102,.55)';c.lineWidth=2;
    c.beginPath();c.arc(0,0,B.maxBladeR,0,TAU);c.stroke();
  }
  if(B.shield>0){
    c.strokeStyle='rgba(111,230,223,'+(0.35+Math.min(.4,B.shield/300)).toFixed(2)+')';
    c.lineWidth=3;c.beginPath();c.arc(0,0,29,0,TAU);c.stroke();
  }
  c.rotate(B.face+Math.PI/2);
  c.fillStyle=B.hitFlash>0?'#ff9aa5':'#25304a';c.strokeStyle='#f0c96b';c.lineWidth=2;
  c.beginPath();c.moveTo(-13,10);c.lineTo(-10,-9);c.lineTo(0,-14);
  c.lineTo(10,-9);c.lineTo(13,10);c.closePath();c.fill();c.stroke();
  c.fillStyle='#f4f1e8';c.beginPath();c.moveTo(-5,-12);c.lineTo(5,-12);c.lineTo(0,-1);c.closePath();c.fill();
  c.fillStyle='#f0c96b';c.fillRect(-1.5,-11,3,11);
  c.fillStyle='#e8bd9a';c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=1;
  c.beginPath();c.arc(0,-18,7,0,TAU);c.fill();c.stroke();
  c.fillStyle='#171b28';c.beginPath();c.arc(0,-20,7,Math.PI,TAU);c.fill();
  c.restore();
}
function drawEffects(c){
  for(var i=0;i<B.bullets.length;i++){
    var bl=B.bullets[i],bx=bl.x-CAM.x,by=bl.y-CAM.y;
    if(bx<-10||bx>W+10||by<-10||by>H+10)continue;
    c.fillStyle=bl.color;c.beginPath();c.arc(bx,by,4,0,TAU);c.fill();
  }
  for(var p=0;p<B.particles.length;p++){
    var q=B.particles[p],sx=q.x-CAM.x,sy=q.y-CAM.y;
    if(sx<-10||sx>W+10||sy<-10||sy>H+10)continue;
    c.globalAlpha=clamp(q.life/q.max,0,1);c.fillStyle=q.color;
    c.fillRect(sx-q.size/2,sy-q.size/2,q.size,q.size);
  }
  c.globalAlpha=1;c.textAlign='center';c.font='bold 12px system-ui';
  for(var k=0;k<B.pops.length;k++){
    var o=B.pops[k];c.globalAlpha=clamp(o.life/o.max,0,1);
    c.fillStyle=o.color;c.fillText(o.text,o.x-CAM.x,o.y-CAM.y);
  }
  c.globalAlpha=1;c.textAlign='left';
}
function drawBar(c,x,y,w,h,pct,c1,c2){
  c.fillStyle='rgba(4,5,10,.85)';c.fillRect(x-2,y-2,w+4,h+4);
  c.fillStyle='#242636';c.fillRect(x,y,w,h);
  var g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c1);g.addColorStop(1,c2);
  c.fillStyle=g;c.fillRect(x,y,w*clamp(pct,0,1),h);
  c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1;c.strokeRect(x+.5,y+.5,w-1,h-1);
}
function drawMiniMap(c){
  var mw=168,mh=126,mx=W-mw-16,my=H-mh-76,sc=Math.min(mw/WORLD_W,mh/WORLD_H);
  c.fillStyle='rgba(6,8,15,.78)';c.fillRect(mx,my,mw,mh);
  for(var ai=0;ai<AREAS.length;ai++){
    var A=AREAS[ai];c.fillStyle=A.tint;
    c.fillRect(mx+A.x*sc,my+A.y*sc,A.w*sc,A.h*sc);
  }
  c.strokeStyle='rgba(240,201,107,.45)';c.lineWidth=1;c.strokeRect(mx+.5,my+.5,mw-1,mh-1);
  c.strokeStyle='rgba(255,255,255,.13)';
  c.beginPath();c.moveTo(mx+mw/2,my);c.lineTo(mx+mw/2,my+mh);
  c.moveTo(mx,my+mh/2);c.lineTo(mx+mw,my+mh/2);c.stroke();
  var fs=Math.max(1,Math.floor(B.fences.length/110));
  c.fillStyle='rgba(200,147,85,.7)';
  for(var f=0;f<B.fences.length;f+=fs)
    c.fillRect(mx+B.fences[f].x*sc-1,my+B.fences[f].y*sc-1,2,2);
  for(var b=0;b<B.buildings.length;b++){
    var bd=B.buildings[b];c.fillStyle='#ffd166';
    c.fillRect(mx+bd.x*sc-1.5,my+bd.y*sc-1.5,3,3);
  }
  var ms=Math.max(1,Math.floor(B.monsters.length/110));
  for(var i=0;i<B.monsters.length;i+=ms){
    var m=B.monsters[i];c.fillStyle=m.type==='elite'?'#ff6b7a':'rgba(255,140,150,.65)';
    c.fillRect(mx+m.x*sc-1,my+m.y*sc-1,2,2);
  }
  c.strokeStyle='rgba(111,230,223,.35)';
  c.strokeRect(mx+CAM.x*sc,my+CAM.y*sc,W*sc,H*sc);
  c.fillStyle='#6fe6df';c.beginPath();c.arc(mx+B.px*sc,my+B.py*sc,3.2,0,TAU);c.fill();
  c.fillStyle='rgba(155,154,176,.85)';c.font='9px system-ui';
  c.fillText('MAP '+WORLD_W+' x '+WORLD_H,mx+6,my+11);
}
function drawHUD(c){
  c.font='bold 11px system-ui';c.fillStyle='#f5f1e6';
  c.fillText('特工 · 固定角色 · '+WEAPONS[B.wIdx].name+'    |    区域：'+areaName(B.px,B.py),20,22);
  drawBar(c,20,30,220,13,B.hp/B.maxHp,'#b8394c','#f2a65a');
  c.fillStyle='rgba(245,241,230,.85)';c.font='10px system-ui';
  c.fillText('HP '+Math.max(0,Math.round(B.hp))+' / '+B.maxHp+
    (B.shield>0?'   护盾 '+Math.round(B.shield):''),20,58);
  if(B.enlargeFrames>0){c.fillStyle='#ffd166';c.fillText('巨刃化 '+(B.enlargeFrames/60).toFixed(1)+'s',20,74);}
  c.textAlign='center';c.fillStyle='rgba(155,154,176,.85)';c.font='10px system-ui';
  c.fillText('刀 片',W/2,18);
  c.fillStyle=B.hundred?'#ffd166':'#f5f1e6';c.font='bold 34px system-ui';
  c.fillText(B.blades+' / '+MAX_BLADES,W/2,50);
  drawBar(c,W/2-130,60,260,8,B.blades/MAX_BLADES,'#3fc9bd','#f0c96b');
  c.textAlign='left';
  c.textAlign='right';c.fillStyle='#f0c96b';c.font='bold 15px system-ui';
  c.fillText(B.gold+' 金币',W-20,24);
  c.font='10px system-ui';c.fillStyle='rgba(155,154,176,.9)';
  c.fillText('击杀 '+B.kills+' · 拆栅栏 '+B.fencesBroken+' · 木栅栏剩 '+B.fences.length,W-20,42);
  c.fillText('第 '+B.wave+' 波 · '+Math.floor(B.frame/60)+'s · 得分 '+B.score,W-20,56);
  c.textAlign='left';
  if(B.banner){
    c.save();c.globalAlpha=clamp(B.banner.life/28,0,1);
    c.textAlign='center';c.font='bold 24px system-ui';
    c.fillStyle=B.banner.color;c.shadowColor=B.banner.color;c.shadowBlur=18;
    c.fillText(B.banner.text,W/2,128);c.restore();
  }
  drawMiniMap(c);
  if(B.hitFlash>0){
    c.fillStyle='rgba(255,80,100,'+(B.hitFlash/10*.13).toFixed(3)+')';c.fillRect(0,0,W,H);
  }
}
function render(){
  if(!c2d||!B)return;
  var c=c2d;c.save();
  if(B.shake>0)c.translate(rnd(-3,3),rnd(-2,2));
  drawGround(c);
  for(var f=0;f<B.fences.length;f++)drawFence(c,B.fences[f]);
  for(var b=0;b<B.buildings.length;b++)drawBuilding(c,B.buildings[b]);
  for(var m=0;m<B.monsters.length;m++)drawMonster(c,B.monsters[m]);
  if(B.bladeXY.length!==B.slots.length)computeBladePositions();
  drawPlayer(c);drawBlades(c);drawEffects(c);drawHUD(c);
  if(B.phase==='over'){
    c.fillStyle='rgba(3,4,9,.5)';c.fillRect(0,0,W,H);
    c.textAlign='center';c.fillStyle='#f5f1e6';c.font='bold 46px system-ui';
    c.fillText('倒下了',W/2,H/2);c.textAlign='left';
  }
  c.restore();
}

/* ---------- 界面 ---------- */
function drawWeaponIcon(c,w){
  var cx=60,cy=42,R=25;
  c.clearRect(0,0,120,86);
  c.strokeStyle='rgba(111,230,223,.35)';c.lineWidth=1;
  c.beginPath();c.arc(cx,cy-3,R,0,TAU);c.stroke();
  c.fillStyle='#25304a';c.strokeStyle='#f0c96b';c.lineWidth=1.5;
  c.beginPath();c.arc(cx,cy-3,7,0,TAU);c.fill();c.stroke();
  for(var i=0;i<3;i++){
    var a=i/3*TAU-.6;
    drawWeaponShape(c,w,9,'#e8e2cf',a+Math.PI/2,cx+Math.cos(a)*R,(cy-3)+Math.sin(a)*R);
  }
}
function renderWeaponChoices(){
  if(!D.weaponList)return;
  var h='';
  for(var i=0;i<WEAPONS.length;i++){
    var w=WEAPONS[i];
    h+='<div class="wcard'+(i===SEL.wi?' sel':'')+'" data-i="'+i+'">'+
       '<canvas width="120" height="86"></canvas><b>'+w.name+'</b><span>'+w.desc+'</span></div>';
  }
  D.weaponList.innerHTML=h;
  var cards=D.weaponList.querySelectorAll('.wcard');
  for(var k=0;k<cards.length;k++){
    var cc=cards[k].querySelector('canvas');
    if(cc&&cc.getContext)drawWeaponIcon(cc.getContext('2d'),WEAPONS[k]);
  }
}
function renderShop(){
  if(!D.shopList)return;
  D.shopGold.textContent=B?B.gold:0;
  var h='';
  for(var i=0;i<SHOP.length;i++){
    var it=SHOP[i],cost=itemCost(it),ok=B&&B.gold>=cost;
    h+='<div class="sitem'+(ok?'':' no')+'" data-buy="'+it.id+'">'+
       '<span class="tag '+it.type+'">'+it.tag+'</span><span class="n">'+it.name+'</span>'+
       '<div class="d">'+it.desc+'</div><div class="p">'+cost+' 金币 · 已购 '+(B?(B.bought[it.id]||0):0)+'</div></div>';
  }
  D.shopList.innerHTML=h;
}
function openShop(){
  if(!B||B.phase!=='play')return;
  B.shopOpen=true;renderShop();
  if(D.shopOverlay)D.shopOverlay.classList.remove('hidden');
}
function closeShop(){
  if(!B)return;
  B.shopOpen=false;
  if(D.shopOverlay)D.shopOverlay.classList.add('hidden');
}
function showResult(){
  D.resultTitle.textContent=B.hundred?'五百刃达成！':'战斗结束';
  D.resultSub.textContent=B.hundred?
    '你已经把刀片堆到 500 把，继续刷新金币与击杀纪录吧':
    '刀片峰值 '+B.peakBlades+' 把，离 500 还差 '+(MAX_BLADES-B.peakBlades)+' 把 · 多拆木栅栏';
  D.resultStats.innerHTML=
    '<div class="stat-box">击杀数<b>'+B.kills+'</b></div>'+
    '<div class="stat-box">拆木栅栏<b>'+B.fencesBroken+'</b></div>'+
    '<div class="stat-box">刀片数<b>'+B.blades+' / 500</b></div>'+
    '<div class="stat-box">金币<b>'+B.gold+'</b></div>'+
    '<div class="stat-box">兑换设施<b>'+countBought()+'</b></div>'+
    '<div class="stat-box">存活时间<b>'+Math.floor(B.frame/60)+'s</b></div>';
  D.resultOverlay.classList.remove('hidden');
}
function countBought(){var n=0;for(var k in B.bought)n+=B.bought[k];return n;}
function hideResult(){D.resultOverlay.classList.add('hidden');}
function updateButtons(){
  if(!D.skillBtn||!B)return;
  if(B.enlargeFrames>0){D.skillBtn.className='bbtn on';D.skillBtn.textContent='巨刃化中 · '+(B.enlargeFrames/60).toFixed(1)+'s';}
  else if(B.skillCd>0){D.skillBtn.className='bbtn cool';D.skillBtn.textContent='冷却 '+(B.skillCd/60).toFixed(1)+'s';}
  else{D.skillBtn.className='bbtn';D.skillBtn.textContent='巨刃化 · 变大 [空格]';}
  if(D.shopBtn)D.shopBtn.textContent='补给站 · '+B.gold+' 金币 [B]';
}
function loop(ts){
  if(!lastTs)lastTs=ts;
  var dt=Math.min(50,ts-lastTs);lastTs=ts;acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<5){stepFrame();acc-=STEP;}
  render();updateButtons();
  if(B&&B.phase==='over'&&!B.shownResult){B.shownResult=true;showResult();}
  requestAnimationFrame(loop);
}

/* ---------- 输入与启动 ---------- */
var KEYMAP={w:'up',arrowup:'up',s:'down',arrowdown:'down',
  a:'left',arrowleft:'left',d:'right',arrowright:'right',' ':'skill'};
function boot(){
  var ids=['cv','soundBtn','restartBtn','skillBtn','shopBtn','stick','knob',
    'startOverlay','weaponList','startBtn','shopOverlay','shopGold','shopList','closeShopBtn',
    'resultOverlay','resultTitle','resultSub','resultStats','againBtn','backBtn'];
  for(var i=0;i<ids.length;i++)D[ids[i]]=document.getElementById(ids[i]);
  c2d=D.cv.getContext('2d');
  renderWeaponChoices();

  window.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(k==='b'){e.preventDefault();if(B&&B.shopOpen)closeShop();else openShop();return;}
    if(k==='escape'){if(B&&B.shopOpen)closeShop();return;}
    if(k>='1'&&k<='4'){e.preventDefault();switchWeapon(parseInt(k,10)-1);renderWeaponChoices();return;}
    var a=KEYMAP[k];if(!a)return;
    e.preventDefault();
    if(a==='skill'){if(!held.skill&&B&&!B.shopOpen)useSkill();held.skill=true;return;}
    held[a]=true;
  });
  window.addEventListener('keyup',function(e){
    var a=KEYMAP[e.key.toLowerCase()];if(!a)return;
    e.preventDefault();held[a]=false;
  });
  window.addEventListener('blur',function(){held={};touchMove={x:0,y:0};});

  D.weaponList.addEventListener('click',function(e){
    var card=e.target&&e.target.closest?e.target.closest('.wcard'):null;
    if(!card)return;
    switchWeapon(parseInt(card.dataset.i,10));
    renderWeaponChoices();
  });
  D.startBtn.onclick=function(){
    D.startOverlay.classList.add('hidden');
    startGame();lastTs=0;acc=0;
  };
  D.skillBtn.onclick=function(){useSkill();};
  D.shopBtn.onclick=function(){if(B&&B.shopOpen)closeShop();else openShop();};
  D.closeShopBtn.onclick=closeShop;
  D.shopList.addEventListener('click',function(e){
    var it=e.target&&e.target.closest?e.target.closest('.sitem'):null;
    if(!it)return;
    if(buyItem(it.dataset.buy))renderShop();
  });
  D.soundBtn.onclick=function(){soundOn=!soundOn;this.textContent='音效：'+(soundOn?'开':'关');};
  function restart(){hideResult();closeShop();startGame();lastTs=0;acc=0;}
  D.restartBtn.onclick=restart;
  D.againBtn.onclick=restart;
  D.backBtn.onclick=function(){
    hideResult();closeShop();B=null;
    D.startOverlay.classList.remove('hidden');renderWeaponChoices();
  };

  // 触屏虚拟摇杆
  var stickActive=false;
  function stickSet(e){
    var rect=D.stick.getBoundingClientRect();
    var dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2);
    var l=Math.sqrt(dx*dx+dy*dy),max=rect.width*0.34;
    if(l>max){dx=dx/l*max;dy=dy/l*max;}
    touchMove={x:dx/max,y:dy/max};
    D.knob.style.transform='translate('+dx+'px,'+dy+'px)';
  }
  D.stick.addEventListener('pointerdown',function(e){stickActive=true;stickSet(e);e.preventDefault();});
  window.addEventListener('pointermove',function(e){if(stickActive)stickSet(e);});
  window.addEventListener('pointerup',function(){
    if(!stickActive)return;
    stickActive=false;touchMove={x:0,y:0};D.knob.style.transform='';
  });

  requestAnimationFrame(loop);
}
if(typeof document!=='undefined')boot();
</script>
</body>
