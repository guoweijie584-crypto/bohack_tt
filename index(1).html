<script type="text/plain" id="serverCode">
/* 源能斗士 II · 开房间联机中继服务（零依赖，Node.js 14+）
   用法：node aether-server.js
   端口：默认 8787，可用环境变量 PORT 修改，例如 PORT=9000 node aether-server.js
   客户端「开房间联机」选择「跨设备」，服务器地址填 ws://服务器IP:8787
*/
'use strict';
const http=require('http'),crypto=require('crypto');
const PORT=Number(process.env.PORT||8787);
const GUID='258EAFA5-E914-47DA-95CA-C5AB0DC85B11';
const rooms=new Map();
function send(sock,text){
  const data=Buffer.from(text,'utf8'),len=data.length;
  let head;
  if(len<126){head=Buffer.alloc(2);head[0]=0x81;head[1]=len;}
  else if(len<65536){head=Buffer.alloc(4);head[0]=0x81;head[1]=126;head.writeUInt16BE(len,2);}
  else{head=Buffer.alloc(10);head[0]=0x81;head[1]=127;head.writeBigUInt64BE(BigInt(len),2);}
  try{sock.write(Buffer.concat([head,data]));}catch(e){}
}
function broadcast(room,text,except){
  const set=rooms.get(room);if(!set)return;
  const data=Buffer.from(text,'utf8');
  for(const c of set)if(c!==except&&c.writable)send(c,data);
}
const server=http.createServer((req,res)=>{
  res.writeHead(200,{'Content-Type':'text/plain; charset=utf-8','Access-Control-Allow-Origin':'*'});
  res.end('Aether Vanguard relay OK | rooms='+rooms.size+'\n');
});
server.on('upgrade',(req,sock)=>{
  const key=req.headers['sec-websocket-key'];
  if(!key){sock.destroy();return;}
  const accept=crypto.createHash('sha1').update(key+GUID).digest('base64');
  sock.write('HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\n'+
    'Connection: Upgrade\r\nSec-WebSocket-Accept: '+accept+'\r\n\r\n');
  let room=null,buf=Buffer.alloc(0);
  const leave=()=>{
    if(!room)return;
    const set=rooms.get(room);
    if(set){set.delete(sock);if(!set.size)rooms.delete(room);}
    room=null;
  };
  const join=r=>{
    leave();
    room=String(r||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
    if(!room)return;
    if(!rooms.has(room))rooms.set(room,new Set());
    rooms.get(room).add(sock);
    console.log('[join] '+room+' · 在线 '+rooms.get(room).size);
  };
  sock.on('data',chunk=>{
    buf=Buffer.concat([buf,chunk]);
    while(buf.length>=2){
      const op=buf[0]&0x0f,masked=!!(buf[1]&0x80);
      let len=buf[1]&0x7f,off=2;
      if(len===126){if(buf.length<4)return;len=buf.readUInt16BE(2);off=4;}
      else if(len===127){if(buf.length<10)return;len=Number(buf.readBigUInt64BE(2));off=10;}
      const maskLen=masked?4:0;
      if(buf.length<off+maskLen+len)return;
      let payload=buf.slice(off+maskLen,off+maskLen+len);
      if(masked){
        const mask=buf.slice(off,off+4),out=Buffer.alloc(len);
        for(let i=0;i<len;i++)out[i]=payload[i]^mask[i%4];
        payload=out;
      }
      buf=buf.slice(off+maskLen+len);
      if(op===8){leave();sock.end();return;}
      if(op!==1)continue;
      let msg;try{msg=JSON.parse(payload.toString('utf8'));}catch(e){continue;}
      if(msg.t==='join'){join(msg.room);continue;}
      if(!room)join(msg.room);
      if(room)broadcast(room,JSON.stringify(msg),sock);
    }
  });
  sock.on('close',leave);
  sock.on('error',leave);
});
server.listen(PORT,()=>console.log('源能斗士 中继服务已启动： ws://0.0.0.0:'+PORT));
</script>
<script>
'use strict';
/* =====================================================================
   源能斗士 II — 主城 / 迷宫闯关 / 融合转职 / 技能树 / 元素 / 伪3D / 房间联机
   ===================================================================== */
const W=640,H=400,TILE=32,SAVE_KEY='aether_vanguard_save_v2';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const minimap=$('minimap'),mctx=minimap.getContext('2d');mctx.imageSmoothingEnabled=false;
const orb=$('orb'),octx=orb.getContext('2d');octx.imageSmoothingEnabled=false;
const stage=$('stage');
let RND=Math.random;
const R=(a,b)=>a+RND()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v),lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1),pick=a=>a[Math.floor(RND()*a.length)];
function seeded(seed,fn){
  let t=(seed>>>0)||1;const old=RND;
  RND=()=>{t+=0x6D2B79F5;let a=t;a=Math.imul(a^(a>>>15),a|1);a^=a+Math.imul(a^(a>>>7),a|61);
    return((a^(a>>>14))>>>0)/4294967296;};
  try{return fn();}finally{RND=old;}
}
const fmt=n=>n>=10000?(n/1000).toFixed(1)+'k':String(Math.floor(n));
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r+(amt>0?(255-r)*amt:r*amt)),0,255);
  g=clamp(Math.round(g+(amt>0?(255-g)*amt:g*amt)),0,255);
  b=clamp(Math.round(b+(amt>0?(255-b)*amt:b*amt)),0,255);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function P(g,c,x,y,w,h){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g];}

  box.appendChild(d);while(box.children.length>6)box.removeChild(box.firstChild);

function treeLv(p,cid,br){return (p.tree[cid]&&p.tree[cid][br])||0;}
function routeLv(p){return p.routeTree||0;}
function collectEff(p){
  const e={},add=o=>{for(const k in o)e[k]=(e[k]||0)+o[k];};
  const t=TREES[p.cid];
  if(t)for(const br of ['A','B']){
    const n=t[br].nodes,l=treeLv(p,p.cid,br);
    for(let i=0;i<l;i++)add(n[i].eff);
  }
  const rt=ROUTES[p.route];
  for(let i=0;i<routeLv(p);i++)add(rt.nodes[i].eff);
  return e;
}
function recalc(p){
  const c=clsOf(p),e=collectEff(p),s=p.stats,lv=p.lv-1,rt=ROUTES[p.route];
  let atk=(c.atk+lv*1.9+s.str*2.4+s.int*1.3)*(1+(e.atk||0));
  let armor=(c.armor+lv*.9+s.vit*1.3)*(1+(e.armor||0));
  let maxHp=(c.hp+lv*14+s.vit*14)*(1+(e.hp||0));
  let maxMp=c.mp+lv*5+s.int*6;
  let spd=c.spd*.9*(1+s.agi*.004)*(1+(e.spd||0))*rt.spdMul;
  let crit=clamp(c.crit+s.agi*.003+(e.crit||0),0,.75);
  let cdr=clamp(s.int*.003+(e.cdr||0)+ (1-rt.cdMul),0,.6);
  let range=c.range*(1+(e.range||0));
  for(const k of ['weapon','armor','trinket']){
    const it=p.equip[k];if(!it)continue;
    for(const a of it.affixes){
      if(a.k==='atk')atk+=a.v;else if(a.k==='armor')armor+=a.v;
      else if(a.k==='hp')maxHp+=a.v;else if(a.k==='crit')crit+=a.v;
      else if(a.k==='cdr')cdr+=a.v;else if(a.k==='spd')spd*=1+a.v;
    }
  }
  p.stat={atk,armor,maxHp:Math.round(maxHp),maxMp:Math.round(maxMp),spd,crit,cdr,
    range,atkCd:c.atkCd,weapon:c.weapon,eff:e,element:c.element,
    mpRegen:rt.mpRegen+(e.mpRegen||0),skillDmg:rt.skillDmg+(e.skillDmg||0),
    elemDur:1+(e.elemDur||0),elemPen:e.elemPen||0,pen:e.pen||0,
    pierce:rt.pierce+(e.pierce||0),chain:2+(e.chain||0),shield:1+(e.shield||0),
    knock:1+(e.knock||0),lifesteal:e.lifesteal||0,mpOnHit:e.mpOnHit||0,
    burn:e.burn||0,freeze:e.freeze||0,shock:e.shock||0,poison:e.poison||0,slow:e.slow||0,
    stealth:e.stealth||0};
  if(p.hp===1){p.hp=p.stat.maxHp;p.mp=p.stat.maxMp;}
  p.hp=clamp(p.hp,0,p.stat.maxHp);p.mp=clamp(p.mp,0,p.stat.maxMp);
}
function affixText(a){
  if(['crit','cdr','spd'].indexOf(a.k)>=0)return '+'+Math.round(a.v*100)+'% '+
    ({crit:'暴击',cdr:'冷却缩减',spd:'移速'}[a.k]);
  return '+'+Math.round(a.v)+' '+a.n;
}
function rollItem(lv,force){
  const slot=pick(['weapon','armor','trinket']);
  const r=force!==undefined?clamp(force,0,4):clamp(Math.floor(Math.pow(Math.random(),1.7)*5+lv/18),0,4);
  const n=1+r,af=[],used={};
  for(let i=0;i<n;i++){
    let a=pick(AFFIX),g=0;while(used[a.k]&&g++<8)a=pick(AFFIX);used[a.k]=1;
    const v=R(a.min,a.max)*(1+lv*.075)*RARITY[r].mul;
    af.push({k:a.k,n:a.n,v:['crit','cdr','spd'].indexOf(a.k)>=0?Math.round(v*1000)/1000:Math.round(v)});
  }
  return{id:uid(),slot,rarity:r,affixes:af,lv,name:'「'+RARITY[r].n+'」'+pick(ITEM_BASE[slot]),
    value:Math.round(24+r*38+lv*8),plus:0};
}

function loadGame(){
  try{
    let d=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!d||!d.p){
      const old=JSON.parse(localStorage.getItem('aether_vanguard_save_v1'));
      if(!old||!old.p)return null;
      d={v:2,p:old.p,floor:1};
    }
    const p=d.p;
    p.cid=V1MAP[p.cid]||p.cid;
    if(!ALL_CLASSES.some(c=>c.id===p.cid))p.cid='warrior';
    if(!ROUTES[p.route])p.route='magic';
    if(!p.classLv)p.classLv={warrior:1,pyro:1,ranger:1,cryo:1,storm:1,assassin:1};
    for(const c of CLASSES)if(!p.classLv[c.id])p.classLv[c.id]=1;
    if(!p.tree)p.tree={};if(typeof p.routeTree!=='number')p.routeTree=0;
    if(!p.ultList)p.ultList=[];if(!p.ult)p.ult=p.ultList[0]||null;
    if(typeof p.tp!=='number')p.tp=Math.max(0,(p.lv-1)*2);
    if(typeof p.sp!=='number')p.sp=0;
    if(!p.stats)p.stats={str:0,agi:0,int:0,vit:0};
    if(!p.fragments)p.fragments=[];if(!p.fusions)p.fusions=[];
    if(!p.bestFloor)p.bestFloor=1;
    if(!p.buffs)p.buffs={shield:0,roar:0,stealth:0,field:0,overload:0};
    if(!p.cd)p.cd={q:0,e:0,r:0,ult:0,dash:0,atk:0};
    if(!p.equip)p.equip={weapon:null,armor:null,trinket:null};
    if(!p.bag)p.bag=[];if(!p.potions)p.potions={hp:5,mp:3};
    p.lv=clamp(p.lv||1,1,50);
    return{p,floor:d.floor||1};
  }catch(e){return null;}
}

/* ---------- 地图工具 ---------- */
function tileAt(tx,ty){
  const m=G.map;if(!m||tx<0||ty<0||tx>=m.w||ty>=m.h)return T.WALL;
  return m.tiles[ty*m.w+tx];
}
function setTile(tx,ty,v){const m=G.map;if(tx>=0&&ty>=0&&tx<m.w&&ty<m.h)m.tiles[ty*m.w+tx]=v;}
function solidAt(tx,ty){return!!SOLID[tileAt(tx,ty)];}
function canMove(x,y,r){
  const x0=Math.floor((x-r)/TILE),x1=Math.floor((x+r)/TILE),
        y0=Math.floor((y-r)/TILE),y1=Math.floor((y+r)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty))return false;
  return true;
}
function moveEnt(e,dx,dy){
  if(dx&&canMove(e.x+dx,e.y,e.r))e.x+=dx;
  if(dy&&canMove(e.x,e.y+dy,e.r))e.y+=dy;
}
function freeSpot(m,margin){
  for(let i=0;i<200;i++){
    const tx=RI(margin,m.w-margin-1),ty=RI(margin,m.h-margin-1);
    if(!SOLID[m.tiles[ty*m.w+tx]])return{x:tx*TILE+16,y:ty*TILE+16};
  }
  return{x:m.w*TILE/2,y:m.h*TILE/2};
}
/* ---------- 主城 ---------- */
function genCity(){
  const w=50,h=36,tiles=new Uint8Array(w*h).fill(T.WALL);
  for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++)tiles[y*w+x]=T.CITY;
  // 外圈石墙
  for(let x=0;x<w;x++){tiles[x]=T.WALL;tiles[(h-1)*w+x]=T.WALL;}
  for(let y=0;y<h;y++){tiles[y*w]=T.WALL;tiles[y*w+w-1]=T.WALL;}
  // 草地与水池
  for(let y=3;y<h-3;y++)for(let x=3;x<w-3;x++){
    const n=hash2(x*.7,y*.7);
    if(n>.86)tiles[y*w+x]=T.GRASS;
  }
  for(let y=11;y<15;y++)for(let x=17;x<22;x++)tiles[y*w+x]=T.WATER;
  // 建筑（实心块，带门）
  const builds=[[5,4,7,5],[30,4,7,5],[5,20,7,5],[30,20,7,5],[18,4,6,4]];
  G.decor=[];
  for(const b of builds){
    for(let y=b[1];y<b[1]+b[3];y++)for(let x=b[0];x<b[0]+b[2];x++)tiles[y*w+x]=T.WALL;
    G.decor.push({x:(b[0]+b[2]/2)*TILE,y:b[1]*TILE,kind:'house',
      w:b[2]*TILE,h:b[3]*TILE});
  }
  // 中央源能井
  G.decor.push({x:21*TILE,y:17*TILE,kind:'well'});
  for(let y=16;y<19;y++)for(let x=20;x<23;x++)tiles[y*w+x]=T.RUIN;
  G.npcs=[
   {x:13*TILE+16,y:12*TILE+16,name:'守门人 · 迦南',icon:'⌂',act:'portal',color:'#e8b06a'},
   {x:21*TILE+16,y:10*TILE+16,name:'源能议会 · 薇拉',icon:'❈',act:'route',color:'#c9a2f0'},
   {x:9*TILE+16,y:19*TILE+16,name:'铁匠 · 老陶',icon:'⚒',act:'shop',color:'#e0954f'},
   {x:29*TILE+16,y:17*TILE+16,name:'转职师 · 无面',icon:'◈',act:'fuse',color:'#f0bd7c'},
   {x:25*TILE+16,y:22*TILE+16,name:'书记官 · 阿禾',icon:'▤',act:'lore',color:'#a3c979'},
   {x:17*TILE+16,y:23*TILE+16,name:'竞技场管理员',icon:'⚔',act:'arena',color:'#df8f6a'}
  ];
  // 传送门
  for(let y=12;y<15;y++)for(let x=12;x<15;x++)tiles[y*w+x]=T.RUIN;
  return{w,h,tiles,name:'曙光主城',type:'city',spawn:{x:21*TILE,y:24*TILE},
    portal:{x:13.5*TILE,y:13.5*TILE},decor:G.decor};
}
/* ---------- 迷宫（房间 + 走廊，逐层闯关） ---------- */
function genDungeon(floor){
  const w=80,h=58,tiles=new Uint8Array(w*h).fill(T.WALL),rooms=[];
  for(let i=0;i<26;i++){
    const rw=RI(6,10),rh=RI(5,8),rx=RI(2,w-rw-3),ry=RI(2,h-rh-3);
    let ok=true;
    for(const o of rooms)if(rx<o.x+o.w+2&&rx+rw+2>o.x&&ry<o.y+o.h+2&&ry+rh+2>o.y){ok=false;break;}
    if(!ok)continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)});
    for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++)
      tiles[y*w+x]=(floor>3&&hash2(x+floor,y)>0.93)?T.RUIN:T.FLOOR;
  }
  if(rooms.length<3){ // 兜底
    rooms.push({x:4,y:4,w:9,h:7,cx:8,cy:7});
    for(let y=4;y<11;y++)for(let x=4;x<13;x++)tiles[y*w+x]=T.FLOOR;
  }
  // L 形走廊连接
  const carve=(x,y)=>{for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)
    if(x+dx>0&&y+dy>0&&x+dx<w-1&&y+dy<h-1)tiles[(y+dy)*w+x+dx]=T.FLOOR;};
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1],b=rooms[i];
    let x=a.cx,y=a.cy;
    while(x!==b.cx){carve(x,y);x+=x<b.cx?1:-1;}
    while(y!==b.cy){carve(x,y);y+=y<b.cy?1:-1;}
  }
  const start=rooms[0],last=rooms[rooms.length-1];
  const exit={x:last.cx*TILE+16,y:last.cy*TILE+16};
  tiles[last.cy*w+last.cx]=T.EXIT;
  // 撒装饰与怪物
  G.decor=[];const spawns=[];
  for(let i=1;i<rooms.length;i++){
    const o=rooms[i],n=RI(1,3)+Math.floor(floor/7);
    for(let j=0;j<n;j++){
      const tx=RI(o.x+1,o.x+o.w-2),ty=RI(o.y+1,o.y+o.h-2);
      if(tiles[ty*w+tx]===T.FLOOR||tiles[ty*w+tx]===T.RUIN)
        spawns.push({x:tx*TILE+16,y:ty*TILE+16});
    }
    if(hash2(o.x,o.y)>.5)G.decor.push({x:o.x*TILE+16,y:o.y*TILE+16,kind:'torch'});
    if(hash2(o.y,o.x)>.7)G.decor.push({x:(o.x+2)*TILE+16,y:(o.y+1)*TILE+16,kind:'crate'});
  }
  for(let i=0;i<26;i++){
    const tx=RI(2,w-3),ty=RI(2,h-3);
    if(tiles[ty*w+tx]===T.WALL&&hash2(tx,ty)>.5)G.decor.push({x:tx*TILE+16,y:ty*TILE+16,kind:'pillar'});
  }
  if(spawns.length>42)spawns.length=42;
  return{w,h,tiles,rooms,name:'源能迷宫 · 第 '+floor+' 层',type:'dungeon',floor,
    spawn:{x:start.cx*TILE+16,y:start.cy*TILE+16},exit,
    bossPos:{x:last.cx*TILE+16,y:last.cy*TILE+16},spawns,
    seen:new Uint8Array(w*h),exitOpen:false,decor:G.decor};
}

function usePortalOrNpc(){
  const p=G.player;
  if(G.mode==='arena'){toast('竞技场中无法交互','#c4a78c');return;}
  if(G.scene==='city'){
    // NPC 交互
    let best=null,bd=76;
    for(const n of G.npcs){const d=dist(p.x,p.y,n.x,n.y);if(d<bd){bd=d;best=n;}}
    if(best){
      if(best.act==='portal'){openPanel('floor');return;}
      if(best.act==='shop'){openPanel('bag');return;}
      if(best.act==='fuse'){openPanel('fuse');return;}
      if(best.act==='route'){openPanel('skill');return;}
      if(best.act==='lore'){openPanel('lore');return;}
      if(best.act==='arena'){openPanel('arena');return;}

    if(G.map.portal&&dist(p.x,p.y,G.map.portal.x,G.map.portal.y)<80){openPanel('floor');return;}

function pickup(d){
  const p=G.player;
  if(d.type==='exp'){gainExp(d.amount);floater(d.x,d.y,'+'+d.amount+' EXP','#a3c979',10);}
  else if(d.type==='gold'){p.gold+=d.amount;floater(d.x,d.y,'+'+d.amount+' G','#f2cd8c',10);}
  else if(d.type==='hp'){p.potions.hp++;floater(d.x,d.y,'+ 生命药剂','#df8f7a',10);}
  else if(d.type==='mp'){p.potions.mp++;floater(d.x,d.y,'+ 源能药剂','#7fb6d8',10);}

function gainExp(n){
  const p=G.player;p.exp+=n;
  while(p.exp>=p.expNext&&p.lv<50){
    p.exp-=p.expNext;p.lv++;p.expNext=Math.round(65*Math.pow(1.13,p.lv-1));
    p.sp+=3;p.tp+=2;
    if(p.classLv[p.cid]!==undefined)p.classLv[p.cid]=Math.max(p.classLv[p.cid]||1,p.lv);
    recalc(p);p.hp=p.stat.maxHp;p.mp=p.stat.maxMp;
    toast('✦ 等级提升 <b>Lv.'+p.lv+'</b> · 属性点 +3 · 技能点 +2','#a3c979');
    effect({kind:'ring',x:p.x,y:p.y,r:10,maxR:120,life:.7,max:.7,color:'#a3c979'});
    burst(p.x,p.y,'#a3c979',28,130,3);G.flash=.25;
    if(p.lv===10)toast('◈ 等级达到 <b>10</b> · 已解锁融合转职系统，请前往角色/转职面板查看','#f0bd7c');
    saveGame();
  }
  if(p.lv>=50)p.exp=0;
}

function fuseReady(f){

function doFuse(id){

function buyTreeNode(br){
  const p=G.player,t=TREES[p.cid];if(!t)return;
  const cur=treeLv(p,p.cid,br),nodes=t[br].nodes;
  if(cur>=nodes.length||p.tp<=0)return;
  p.tp--;
  if(!p.tree[p.cid])p.tree[p.cid]={A:0,B:0};
  p.tree[p.cid][br]=cur+1;
  const node=nodes[cur];
  if(node.ult){
    p.ultList=p.ultList||[];
    if(p.ultList.indexOf(node.ult)<0)p.ultList.push(node.ult);
    p.ult=node.ult;
    toast('✦ 解锁奥义 <b>'+ULTS[node.ult].n+'</b>（鼠标右键释放）','#f0bd7c');
  }else toast('技能树 · <b>'+node.n+'</b> 已点亮','#a3c979');
  recalc(p);saveGame();
}
function buyRouteNode(){
  const p=G.player,rt=ROUTES[p.route],cur=routeLv(p);
  if(cur>=rt.nodes.length||p.tp<=0)return;
  p.tp--;p.routeTree=cur+1;

  else if(k==='f')usePortalOrNpc();
  else if(k==='q')castSkill(0);
  else if(k==='e')castSkill(1);
  else if(k==='r')castSkill(2);
  else if(k===' '||k==='spacebar')dash();
  else if(k==='1')usePotion('hp');
  else if(k==='2')usePotion('mp');
});
window.addEventListener('keyup',e=>{G.keys[e.key.toLowerCase()]=false;});
function usePotion(t){
  const p=G.player;

  if(t==='hp'){
    if(p.hp>=p.stat.maxHp){toast('生命已满','#c4a78c');return;}
    p.potions.hp--;p.hp=Math.min(p.stat.maxHp,p.hp+p.stat.maxHp*.4);
    floater(p.x,p.y-22,'+'+Math.round(p.stat.maxHp*.4),'#a3c979',13);
  }else{
    if(p.mp>=p.stat.maxMp){toast('源能已满','#c4a78c');return;}
    p.potions.mp--;p.mp=Math.min(p.stat.maxMp,p.mp+p.stat.maxMp*.5);
    floater(p.x,p.y-22,'+'+Math.round(p.stat.maxMp*.5),'#7fb6d8',13);
  }
  burst(p.x,p.y,t==='hp'?'#a3c979':'#7fb6d8',12,70,2);saveGame();

function moveDir(){
  const p=G.player;
  if(p.mdx||p.mdy)return Math.atan2(p.mdy,p.mdx);
  if(typeof p.lastAngle==='number')return p.lastAngle;
  return p.facing>0?0:Math.PI;
}
function aimAngle(){
  const p=G.player,t=autoTarget();
  if(t)return Math.atan2(t.y-p.y,t.x-p.x);
  return moveDir();
}
function autoTarget(range){
  const p=G.player;let best=null,bd=range||(p.stat.range+110);
  for(const e of G.enemies)if(!e.dead){
    const d=dist(p.x,p.y,e.x,e.y);if(d<bd){bd=d;best=e;}
  }
  return best;
}
function dash(){
  const p=G.player;
  if(p.cd.dash>0)return;
  p.cd.dash=2.6*(1-p.stat.cdr*.4);

  for(let i=0;i<8;i++)moveEnt(p,Math.cos(a)*7,Math.sin(a)*7);

function shoot(o){

    r:o.r||4,dmg:o.dmg,life:o.life||1.7,max:o.life||1.7,owner:o.owner||'player',
    color:o.color,pierce:o.pierce||0,hit:[],homing:o.homing||0,splash:o.splash||0,
    el:o.el||'physical',crit:!!o.crit,status:o.status||{},size:o.size||4,
    kind:o.kind||'bolt',knock:o.knock||0});

function rollDmg(mult,forceCrit){
  const p=G.player,st=p.stat;
  const crit=forceCrit||Math.random()<st.crit||p.buffs.stealth>0;
  let d=st.atk*mult*st.skillDmg*(crit?2:1)*(p.buffs.overload>0?1.45:1);
  return{d,crit};
}
/* 元素伤害 + 状态 */
function damageEnemy(e,d,opt){
  if(e.dead)return;
  opt=opt||{};const p=G.player,st=p.stat,el=opt.el||st.element;
  const weak=e.weak===el?1.35:(e.el===el?.8:1);
  let v=Math.max(1,d*weak-e.armor*(1-st.pen)*.5);
  if(st.elemPen)v*=1+st.elemPen*.2;
  e.hp-=v;e.flash=.12;e.knock=(opt.knock||0)*st.knock;
  if(opt.stun)e.stun=Math.max(e.stun,opt.stun);
  const dur=st.elemDur;
  if(el==='fire'||opt.status?.burn){e.burn=Math.max(e.burn,2.5*dur);}
  if(el==='ice'||opt.status?.freeze){e.slow=Math.max(e.slow,2.5*dur);
    if(opt.freeze||Math.random()<.18)e.stun=Math.max(e.stun,.7*dur);}
  if(el==='lightning'||opt.status?.shock){e.shock=Math.max(e.shock,2*dur);}
  if(el==='poison'||opt.status?.poison){e.poison=Math.max(e.poison,3.5*dur);}
  if(opt.slow)e.slow=Math.max(e.slow,opt.slow*dur);
  const col=opt.crit?'#ffe6a0':(ELEM[el]?ELEM[el].c:'#fff3dd');
  floater(e.x+R(-6,6),e.y-e.r-6,Math.round(v)+(weak>1?' ✦':''),col,opt.crit?15:11);
  if(Math.random()<.5)burst(e.x,e.y,col,4,60,2);
  if(st.lifesteal>0)p.hp=Math.min(st.maxHp,p.hp+v*st.lifesteal);
  if(ROUTES[p.route].mpRegen<5&&st.mpOnHit)p.mp=Math.min(st.maxMp,p.mp+st.mpOnHit*.4);
  if(e.hp<=0)killEnemy(e);
}
function damagePlayer(d,el){
  const p=G.player;
  if(G.state!=='play'||p.invuln>0)return;
  if(p.buffs.stealth>0&&Math.random()<.3)return;
  let v=Math.max(1,d-p.stat.armor*.55);
  if(p.buffs.field>0||p.buffs.roar>0)v*=.55;
  if(p.buffs.shield>0){const ab=Math.min(p.buffs.shield,v);p.buffs.shield-=ab;v-=ab;}
  p.hp-=v;p.invuln=.42;
  floater(p.x,p.y-26,'-'+Math.round(v),'#ff9b7a',13);
  burst(p.x,p.y,'#df5f57',10,90,2);G.shake=6;G.flash=.16;
  if(p.hp<=0)playerDie();
}
function killEnemy(e){
  if(e.dead)return;e.dead=true;

  p.kills++;dropLoot(e.x,e.y,e);

    toast('☠ <b>源核暴君</b> 被击溃！本层出口开启','#f0bd7c');G.flash=.5;G.shake=15;
    dropLoot(e.x+20,e.y,e);dropLoot(e.x-20,e.y,e);}

function playerDie(){

    leaveArena(false,'⚔ 竞技场落败 · 已在主城重整');G.state='play';saveGame();return;

function revive(){
  const p=G.player;p.gold=Math.floor(p.gold*.9);
  p.hp=p.stat.maxHp;p.mp=p.stat.maxMp;p.invuln=2;
  for(const k in p.cd)p.cd[k]=0;for(const k in p.buffs)p.buffs[k]=0;

/* ---------- 普通攻击：远程自动索敌 / 近战范围挥击 + 小击退 ---------- */
function basicAttack(){
  const p=G.player,st=p.stat;
  if(p.cd.atk>0||G.paused||G.panel||G.state!=='play')return;
  p.cd.atk=st.atkCd*(1-st.cdr*.4);
  const c=clsOf(p),el=st.element,col=ELEM[el].c;
  if(st.weapon==='sword'||st.weapon==='dagger'){
    const a=moveDir(),rg=st.range;
    effect({kind:'slash',x:p.x,y:p.y,a,r:rg+16,life:.18,max:.18,color:col,wide:true});
    for(const e of G.enemies)if(!e.dead&&dist(p.x,p.y,e.x,e.y)<rg+e.r)
      damageEnemy(e,st.atk,{el,knock:34,crit:Math.random()<st.crit,
        status:{poison:st.poison>0,burn:st.burn>0,freeze:st.freeze>0}});
    burst(p.x+Math.cos(a)*26,p.y+Math.sin(a)*26,col,5,60,2);
  }else{
    const t=autoTarget();
    if(!t){ // 无目标时朝行走方向空射
      shoot({x:p.x,y:p.y,a:moveDir(),speed:7,dmg:st.atk,el,color:col,
        pierce:st.pierce,size:st.weapon==='bow'?3:5,kind:st.weapon==='bow'?'arrow':'orb'});
      return;
    }
    const a=Math.atan2(t.y-p.y,t.x-p.x);
    p.facing=Math.cos(a)<0?-1:1;
    shoot({x:p.x+Math.cos(a)*14,y:p.y+Math.sin(a)*14,a,speed:st.weapon==='bow'?8:6.6,
      dmg:st.atk,el,color:col,pierce:st.pierce,homing:1.4,size:st.weapon==='bow'?3:5,
      kind:st.weapon==='bow'?'arrow':'orb',
      status:{poison:st.poison>0,burn:st.burn>0,freeze:st.freeze>0,shock:st.shock>0}});
  }
  if(st.mpOnHit)p.mp=Math.min(st.maxMp,p.mp+st.mpOnHit);
}
/* ---------- 技能 ---------- */
function castSkill(i){
  const p=G.player,sk=SKILLS[p.cid][i],key=['q','e','r'][i];
  if(G.paused||G.panel||G.state!=='play'||!sk)return;

  if(p.mp<sk.cost){toast('源能不足','#df8f7a');return;}
  p.mp-=sk.cost;

function castUlt(){

function castByKind(sk,mult,isUlt){

    effect({kind:'ring',x:p.x,y:p.y,r:8,maxR:110,life:.5,max:.5,color:col});

    if(k==='beam'){
      effect({kind:'beam',x:p.x,y:p.y,a:aa,life:.5,max:.5,color:col,width:26});

    }else{
      shoot({x:p.x,y:p.y,a:aa,speed:7,dmg:d,el,color:col,pierce:st.pierce,
        homing:2.4,splash:35,size:6,kind:'orb',status,crit:Math.random()<st.crit});
    }
  }else if(k==='multi'){
    for(let j=0;j<7;j++)shoot({x:p.x,y:p.y,a:a+(j-3)*.13,speed:8,dmg:d*.75,el,color:col,
      pierce:st.pierce+1,size:3,kind:'arrow',status});
  }else if(k==='meteor'||k==='meteors'){
    const t=autoTarget(420),tx=t?t.x:p.x+Math.cos(moveDir())*160,ty=t?t.y:p.y+Math.sin(moveDir())*160;
    const n=k==='meteors'?4:1;

  }else if(k==='nova'){

    for(const e of G.enemies)if(!e.dead&&dist(p.x,p.y,e.x,e.y)<160+e.r)
      damageEnemy(e,d,{el,stun:el==='ice'?1.1:0,knock:90*st.knock,status});
    burst(p.x,p.y,col,30,170,3);G.shake=6;
  }else if(k==='chain'){
    let cur=autoTarget(360),used=[],dd=d;
    for(let j=0;j<st.chain&&cur;j++){
      used.push(cur);damageEnemy(cur,dd,{el,stun:.2,status});
      if(j>0)effect({kind:'line',x:used[j-1].x,y:used[j-1].y,x2:cur.x,y2:cur.y,life:.25,max:.25,color:col});
      const nx=G.enemies.find(o=>!o.dead&&used.indexOf(o)<0&&dist(o.x,o.y,cur.x,cur.y)<190);

    G.traps.push({x:p.x,y:p.y,r:72,life:14,arm:.4,dmg:d,el,status});
    effect({kind:'ring',x:p.x,y:p.y,r:4,maxR:72,life:.4,max:.4,color:col});
  }else if(k==='aura'){

    burst(p.x,p.y,col,24,140,3);

    G.turrets.push({x:p.x,y:p.y,life:12,cd:0,dmg:d*.6,el,color:col});

function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(!l2)return dist(px,py,x1,y1);
  const t=clamp(((px-x1)*dx+(py-y1)*dy)/l2,0,1);
  return dist(px,py,x1+t*dx,y1+t*dy);
}
function enemyBullet(e,a,speed,dmg,color,el){
  shoot({x:e.x,y:e.y,a,speed:speed||3.6,dmg,owner:'enemy',color:color||e.color,
    life:2.6,size:5,kind:'orb',r:5,el:el||e.el});
}
/* ---------- 敌人 AI ---------- */
function updateEnemies(dt){
  const p=G.player,st=p.stat;
  for(const e of G.enemies){
    if(e.dead)continue;
    e.anim+=dt*6;e.frame=e.anim%2<1?0:1;
    if(e.flash>0)e.flash-=dt;
    // 元素状态
    const dur=st.elemDur;
    if(e.burn>0){e.burn-=dt;e.hp-=dt*st.atk*(.26+st.burn*.4);
      if(Math.random()<dt*9)burst(e.x,e.y,'#ff9a55',1,26,2);}
    if(e.poison>0){e.poison-=dt;e.hp-=dt*st.atk*(.18+st.poison*.35);}
    if(e.shock>0){e.shock-=dt;e.armor0=e.armor0||e.armor;e.armor=e.armor0*.75;}
    else if(e.armor0){e.armor=e.armor0;e.armor0=0;}
    if(e.slow>0)e.slow-=dt;
    if(e.hp<=0){killEnemy(e);continue;}
    if(e.stun>0){e.stun-=dt;continue;}
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    const spd=e.spd*(e.slow>0?.55:1);
    let mvx=0,mvy=0;
    if(e.ai==='chase'||e.ai==='charger'){
      if(d>e.r+p.r+4){mvx=ux*spd;mvy=uy*spd;}
      if(d<e.r+p.r+10&&e.cd<=0){damagePlayer(e.atk,e.el);e.cd=e.ai==='charger'?1.4:1.1;}
      if(e.ai==='charger'&&e.cd<=0&&d<240&&d>60){
        for(let j=0;j<8;j++)moveEnt(e,ux*4,uy*4);e.cd=1.6;
      }
    }else if(e.ai==='shooter'){
      const rg=e.range||220;
      if(d>rg*.85){mvx=ux*spd;mvy=uy*spd;}
      else if(d<105){mvx=-ux*spd*.8;mvy=-uy*spd*.8;}
      else{mvx=-uy*spd*.45;mvy=ux*spd*.45;}
      e.shotTimer-=dt;
      if(e.shotTimer<=0&&d<rg+90){enemyBullet(e,Math.atan2(dy,dx),3.8,e.atk*.85,e.color,e.el);e.shotTimer=2;}
    }else if(e.ai==='boss'){
      e.phase=e.hp<e.maxHp*.5?2:1;
      if(d>90){mvx=ux*spd*.85;mvy=uy*spd*.85;}
      if(d<e.r+p.r+12&&e.cd<=0){damagePlayer(e.atk,e.el);e.cd=1.4;}
      e.shotTimer-=dt;
      if(e.shotTimer<=0){
        const n=e.phase===2?16:11,off=R(0,6.283);
        for(let j=0;j<n;j++)enemyBullet(e,off+j*6.283/n,e.phase===2?3.7:3.1,e.atk*.62,'#e06858','fire');
        e.shotTimer=e.phase===2?2.2:3.2;
        effect({kind:'ring',x:e.x,y:e.y,r:8,maxR:80,life:.4,max:.4,color:'#e06858'});
      }
      e.powerCd-=dt;
      if(e.phase===2&&e.powerCd<=0){e.powerCd=9;
        for(let j=0;j<2;j++)spawnEnemy(pick(['wisp','eye','spark']),e.x+R(-70,70),e.y+R(-70,70),.8);
        toast('<b style="color:#e06858">源核暴君</b> 撕裂空间，召来援军','#e06858');}
    }else if(e.ai==='rival'){
      const want=190,A=G.ARENA;
      if(d>want+45){mvx=ux*spd;mvy=uy*spd;}
      else if(d<want-45){mvx=-ux*spd*.8;mvy=-uy*spd*.8;}
      else{mvx=-uy*spd*.75;mvy=ux*spd*.75;}
      e.shotTimer-=dt;e.dashCd-=dt;e.powerCd-=dt;
      if(e.shotTimer<=0){const a=Math.atan2(dy,dx);
        for(let j=-1;j<=1;j++)enemyBullet(e,a+j*.16,4.4,e.atk*.55,ROUTES[e.route].color,e.el);
        e.shotTimer=1.5;}
      if(e.dashCd<=0&&d<300){e.dashCd=6;
        for(let j=0;j<14;j++)moveEnt(e,ux*7,uy*7);
        effect({kind:'line',x:e.x-ux*100,y:e.y-uy*100,x2:e.x,y2:e.y,life:.25,max:.25,color:e.color});
        if(dist(p.x,p.y,e.x,e.y)<50)damagePlayer(e.atk*.9,e.el);}
      if(e.powerCd<=0){e.powerCd=10;const off=R(0,6.283);
        for(let j=0;j<10;j++)enemyBullet(e,off+j*6.283/10,3.5,e.atk*.5,e.color,e.el);
        effect({kind:'ring',x:e.x,y:e.y,r:8,maxR:110,life:.45,max:.45,color:e.color});}
    }
    if(e.knock>0){moveEnt(e,-ux*e.knock*dt*2,-uy*e.knock*dt*2);
      e.knock=Math.max(0,e.knock-dt*260);}
    if(G.mode==='arena'&&G.ARENA){
      const A=G.ARENA,cd=dist(e.x,e.y,A.x,A.y);
      if(cd>A.r-e.r){e.x=A.x+(e.x-A.x)/cd*(A.r-e.r);e.y=A.y+(e.y-A.y)/cd*(A.r-e.r);}
    }
    moveEnt(e,mvx,mvy);e.cd-=dt;
  }
  for(let i=0;i<G.enemies.length;i++){
    const a=G.enemies[i];if(a.dead)continue;
    for(let j=i+1;j<G.enemies.length;j++){
      const b=G.enemies[j];if(b.dead)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;
      if(d>0&&d<min){const f=(min-d)*.16;a.x-=dx/d*f;a.y-=dy/d*f;b.x+=dx/d*f;b.y+=dy/d*f;}
    }

}
function updateProjectiles(dt){
  const p=G.player;
  for(const q of G.projectiles){
    if(q.life<=0)continue;
    if(q.homing&&q.owner==='player'){
      let best=null,bd=340;
      for(const e of G.enemies)if(!e.dead&&q.hit.indexOf(e.id)<0){
        const d=dist(q.x,q.y,e.x,e.y);if(d<bd){bd=d;best=e;}
      }
      if(best){const want=Math.atan2(best.y-q.y,best.x-q.x);
        let diff=((want-q.a+Math.PI*3)%(Math.PI*2))-Math.PI;
        q.a+=clamp(diff,-q.homing*dt,q.homing*dt);
        const s=Math.hypot(q.vx,q.vy);q.vx=Math.cos(q.a)*s;q.vy=Math.sin(q.a)*s;}
    }
    q.x+=q.vx*dt*60;q.y+=q.vy*dt*60;q.life-=dt;
    if(solidAt(Math.floor(q.x/TILE),Math.floor(q.y/TILE))){q.life=0;burst(q.x,q.y,q.color,5,50,2);continue;}
    if(q.owner==='player'){
      for(const e of G.enemies){
        if(e.dead||q.hit.indexOf(e.id)>=0)continue;
        if(dist(e.x,e.y,q.x,q.y)<e.r+q.r){
          q.hit.push(e.id);
          damageEnemy(e,q.dmg,{el:q.el,crit:q.crit,status:q.status,knock:q.knock});
          burst(q.x,q.y,q.color,7,80,2);
          if(q.splash){effect({kind:'ring',x:q.x,y:q.y,r:4,maxR:q.splash,life:.25,max:.25,color:q.color});
            for(const o of G.enemies)if(!o.dead&&o!==e&&dist(o.x,o.y,q.x,q.y)<q.splash)
              damageEnemy(o,q.dmg*.45,{el:q.el,status:q.status});}
          if(q.pierce>0)q.pierce--;else{q.life=0;break;}
        }
      }
    }else if(dist(p.x,p.y,q.x,q.y)<p.r+q.r){
      damagePlayer(q.dmg,q.el);q.life=0;burst(q.x,q.y,q.color,6,70,2);
    }
  }
  G.projectiles=G.projectiles.filter(q=>q.life>0);
}

function updateDrops(dt){

const NET={mode:'off',room:'',seed:0,self:'',name:'斗士',peers:{},channel:null,ws:null,
  url:'ws://localhost:8787',chat:[],tick:0,host:false,connected:false};
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function netCode(){const a='ACDEFGHJKLMNPQRTUVWXY34679';let s='';for(let i=0;i<6;i++)s+=a[RI(0,a.length-1)];return s;}
function netSelf(){
  if(!NET.self){
    let s='';try{s=localStorage.getItem('av_net_id')||'';}catch(e){}
    if(!s){s='p'+Math.random().toString(36).slice(2,9);try{localStorage.setItem('av_net_id',s);}catch(e){}}
    NET.self=s;
  }
  NET.name=(G.player?clsOf(G.player.cid).name:'斗士')+'-'+NET.self.slice(-3).toUpperCase();
  return NET.self;
}
function netClose(){
  try{if(NET.channel){NET.channel.close();}}catch(e){}
  try{if(NET.ws){NET.ws.onclose=null;NET.ws.close();}}catch(e){}
  NET.channel=null;NET.ws=null;
}
function netSend(o){
  o.from=netSelf();o.room=NET.room;
  try{
    if(NET.channel){NET.channel.postMessage(o);}
    else if(NET.ws&&NET.ws.readyState===1){NET.ws.send(JSON.stringify(o));}
  }catch(e){}
}
function netOn(o){
  if(!o||o.from===NET.self||o.room!==NET.room)return;
  if(o.t==='hello'){netBroadcastState();return;}
  if(o.t==='leave'){delete NET.peers[o.from];if(G.panel==='room')renderPanel();return;}
  if(o.t==='state'){
    NET.peers[o.from]=Object.assign({ts:Date.now()},o);
    if(NET.peers[o.from].t)delete NET.peers[o.from].t;
    return;
  }
  if(o.t==='chat'){
    NET.chat.push({n:o.n||'斗士',s:String(o.s||'').slice(0,120),time:Date.now()});
    if(NET.chat.length>30)NET.chat.shift();
    if(G.panel==='room')renderPanel();
    else toast('⟡ <b>'+(o.n||'斗士')+'</b>：'+String(o.s||''),'#7fd6c4');
    return;
  }
  if(o.t==='event'){
    toast('⟡ <b>'+(o.n||'队友')+'</b> '+String(o.s||''),'#7fd6c4');
  }
}
function netBroadcastState(){
  const p=G.player;if(!p||!NET.room)return;
  netSend({t:'state',n:NET.name,cid:p.cid,route:p.route,lv:p.lv,
    x:Math.round(p.x),y:Math.round(p.y),hp:Math.round(p.hp),maxHp:Math.round(p.stat.maxHp),
    scene:G.scene,floor:G.floor,mode:G.mode});
}
function netJoin(code,mode,url){
  netClose();
  NET.mode=mode==='ws'?'ws':'local';NET.room=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  if(!NET.room){toast('请输入房间码','#df8f7a');NET.mode='off';return;}
  NET.seed=hashStr(NET.room);NET.peers={};NET.chat=[];NET.connected=false;
  netSelf();
  if(NET.mode==='local'){
    if(typeof BroadcastChannel==='undefined'){toast('当前浏览器不支持 BroadcastChannel','#df8f7a');NET.mode='off';NET.room='';return;}
    try{
      NET.channel=new BroadcastChannel('aether_vanguard_'+NET.room);
      NET.channel.onmessage=e=>netOn(e.data);
    }catch(err){
      toast('本机房间通道创建失败：'+err.message+' · 请改用跨设备模式','#df8f7a');
      NET.mode='off';NET.room='';return;
    }
    NET.connected=true;NET.host=true;
    toast('⟡ 房间 <b>'+NET.room+'</b> 已创建 · 同一浏览器打开多个窗口输入此码即可同层探索','#7fd6c4');
  }else{
    NET.url=url||NET.url;
    try{NET.ws=new WebSocket(NET.url);}catch(e){toast('服务器地址无效：'+e.message,'#df8f7a');NET.mode='off';return;}
    NET.ws.onopen=()=>{NET.connected=true;netSend({t:'join',n:NET.name});
      toast('⟡ 已连接中继服务器 · 房间 <b>'+NET.room+'</b>','#7fd6c4');
      if(G.panel==='room')renderPanel();};
    NET.ws.onmessage=e=>{try{netOn(JSON.parse(e.data));}catch(err){}};
    NET.ws.onerror=()=>{toast('⚠ 无法连接 '+NET.url+' · 请启动 aether-server.js','#df8f7a');};
    NET.ws.onclose=()=>{NET.connected=false;if(G.panel==='room')renderPanel();
      toast('⟡ 与中继服务器断开','#df8f7a');};
    toast('正在连接 <b>'+NET.url+'</b> …','#7fd6c4');
  }
  netSend({t:'hello'});netBroadcastState();
  if(G.panel==='room')renderPanel();
  updateHUD(true);
}
function netLeave(){
  if(NET.room)netSend({t:'leave'});
  netClose();NET.mode='off';NET.room='';NET.peers={};NET.connected=false;
  toast('已离开房间','#c4a78c');
  if(G.panel==='room')renderPanel();updateHUD(true);
}
function netSay(s){
  s=String(s||'').trim().slice(0,120);if(!s)return;
  if(!NET.room){toast('尚未加入房间','#df8f7a');return;}
  netSend({t:'chat',n:NET.name,s});

function netTick(dt){
  if(!NET.room)return;

function genArenaMap(){

  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const d=Math.hypot(x-cx,y-cy);
    if(d<9)tiles[y*w+x]=(d>8.1?T.RUIN:T.FLOOR);
  }
  return{w,h,tiles,name:'镜像竞技场',type:'arena',spawn:{x:cx*TILE,y:(cy+4)*TILE},
    decor:[],seen:new Uint8Array(w*h).fill(1)};

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  if(G.state==='title'||!G.map){titleBg();return;}
  const p=G.player,m=G.map;
  let shx=0,shy=0;
  if(G.shake>0){shx=R(-G.shake,G.shake)*.6;shy=R(-G.shake,G.shake)*.6;}
  const camx=Math.round(G.cam.x-shx),camy=Math.round(G.cam.y-shy);
  const ox=-camx,oy=-camy;
  // 背景
  P(ctx,'#150e09',0,0,W,H);
  const tx0=Math.max(0,Math.floor(camx/TILE)-1),tx1=Math.min(m.w-1,Math.ceil((camx+W)/TILE)+1);
  const ty0=Math.max(0,Math.floor(camy/TILE)-2),ty1=Math.min(m.h-1,Math.ceil((camy+H)/TILE)+2);
  // 地面层
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    const v=m.tiles[ty*m.w+tx],x=tx*TILE+ox,y=ty*TILE+oy;
    if(v!==T.WALL)drawFloorTile(v,v,x,y,tx,ty);
    else drawFloorTile(v,TILE_BASE[1],x,y,tx,ty);
  }
  // 传送门 / 竞技场地面光
  if(m.type==='arena'&&G.ARENA){
    const a=G.ARENA;ctx.strokeStyle='rgba(240,189,124,.35)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(a.x+ox,a.y+oy,a.r,0,6.283);ctx.stroke();
    ctx.setLineDash([5,9]);ctx.beginPath();ctx.arc(a.x+ox,a.y+oy,a.r-24,0,6.283);ctx.stroke();ctx.setLineDash([]);
  }
  // Y 排序：墙 / 装饰 / 实体 / 掉落
  const list=[];
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    if(m.tiles[ty*m.w+tx]===T.WALL)list.push({y:(ty+1)*TILE,z:0,f:()=>drawWall(0,tx*TILE+ox,ty*TILE+oy,tx,ty)});
  }
  for(const d of (m.decor||[])){
    const sx=d.x+ox,sy=d.y+oy;if(sx<-260||sx>W+260||sy<-200||sy>H+260)continue;
    list.push({y:d.y+(d.kind==='house'?d.h*.8:8),z:1,f:()=>decorSprite(d,sx,sy)});
  }
  if(m.type==='city')for(const n of G.npcs){
    const sx=n.x+ox,sy=n.y+oy;if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
    list.push({y:n.y,z:2,f:()=>{
      humanoid(sx,sy,{scale:1,color:n.color,hair:'#4a3020',frame:G.time*1.4,face:1,
        weapon:'staff',name:n.name,nameColor:n.color});
      if(dist(n.x,n.y,p.x,p.y)<90){
        ctx.font='9px "Microsoft YaHei",sans-serif';ctx.textAlign='center';
        ctx.fillStyle='#ffe9c9';ctx.fillText('F 交谈',sx,sy+14);
      }
    }});
  }
  for(const d of G.drops){
    const sx=d.x+ox,sy=d.y+oy;if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
    if(!seenAt(Math.floor(d.x/TILE),Math.floor(d.y/TILE)))continue;
    list.push({y:d.y,z:1,f:()=>dropSprite(d,sx,sy)});
  }
  for(const e of G.enemies){
    if(e.dead)continue;
    const sx=e.x+ox,sy=e.y+oy;if(sx<-70||sx>W+70||sy<-90||sy>H+90)continue;
    if(!seenAt(Math.floor(e.x/TILE),Math.floor(e.y/TILE)))continue;
    list.push({y:e.y,z:3,f:()=>{
      if(e.rival){const c=clsOf(e.cid);
        humanoid(sx,sy,{scale:e.boss?2:1,color:c.color,hair:c.hair,frame:e.anim,
          face:e.x<p.x?-1:1,weapon:c.weapon,el:e.el,name:e.name,nameColor:'#ffbd8a'});
        const w=44,ratio=clamp(e.hp/e.maxHp,0,1);
        P(ctx,'rgba(24,14,8,.85)',sx-w/2-1,sy-48,w+2,6);
        P(ctx,'#e8a765',sx-w/2,sy-47,w*ratio,4);
      }else enemySprite(e,sx,sy);
    }});
  }
  if(p){
    list.push({y:p.y,z:4,f:()=>{
      const c=clsOf(p.cid);
      if(p.buffs.stealth>0)ctx.globalAlpha=.5;
      humanoid(p.x+ox,p.y+oy,{scale:1,color:c.color,hair:c.hair,frame:p.walk,
        face:p.facing,weapon:p.stat.weapon,el:p.stat.element,

      ctx.beginPath();ctx.ellipse(p.x+ox,p.y+oy,13,5,0,0,6.283);ctx.stroke();ctx.globalAlpha=1;
      if(p.buffs.shield>0){
        ctx.strokeStyle='rgba(127,214,196,.6)';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(p.x+ox,p.y+oy-16,20,0,6.283);ctx.stroke();
      }
      if(p.buffs.stealth>0){
        ctx.strokeStyle='rgba(201,162,240,.6)';ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.arc(p.x+ox,p.y+oy-16,18,0,6.283);ctx.stroke();ctx.setLineDash([]);
      }
    }});
  }
  for(const k in NET.peers){
    const q=NET.peers[k];
    if(q.scene!==G.scene||q.floor!==G.floor)continue;
    const sx=(q.x||0)+ox,sy=(q.y||0)+oy;
    list.push({y:q.y||0,z:3,f:()=>netGhostSprite(q,sx,sy)});
  }
  list.sort((a,b)=>a.y-b.y||a.z-b.z);
  for(const it of list)it.f();
  // 投射物
  for(const q of G.projectiles){
    const x=q.x+ox,y=q.y+oy;
    ctx.globalAlpha=.55;ctx.strokeStyle=q.color;ctx.lineWidth=q.size||3;
    ctx.beginPath();ctx.moveTo(x-q.vx*2.5,y-q.vy*2.5);ctx.lineTo(x,y);ctx.stroke();
    ctx.globalAlpha=1;ctx.fillStyle=q.color;
    ctx.beginPath();ctx.arc(x,y,q.size||3,0,6.283);ctx.fill();
    ctx.fillStyle='rgba(255,240,205,.8)';ctx.beginPath();ctx.arc(x-1,y-1,1.4,0,6.283);ctx.fill();
  }
  // 陷阱 / 炮台
  for(const t of G.traps){
    const x=t.x+ox,y=t.y+oy;ctx.strokeStyle='#a3c979';ctx.globalAlpha=.5;
    ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(x,y,t.r,0,6.283);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  for(const t of G.turrets){
    const x=t.x+ox,y=t.y+oy;shadow(x,y,9,3,.35);
    P(ctx,'#7a5637',x-7,y-16,14,16);P(ctx,t.color,x-5,y-21,10,6);
    P(ctx,'#c9a25e',x-8,y-22,16,3);
  }
  // 特效
  for(const f of G.effects)effectSprite(f,ox,oy);
  // 粒子
  for(const q of G.particles){
    ctx.globalAlpha=clamp(q.life/q.max,0,1);
    P(ctx,q.color,q.x+ox,q.y+oy,q.size,q.size);
  }
  ctx.globalAlpha=1;
  // 飘字
  ctx.textAlign='center';
  for(const f of G.floaters){
    ctx.font='bold '+(f.size||11)+'px "Microsoft YaHei",sans-serif';
    ctx.globalAlpha=clamp(f.life/f.max,0,1);
    ctx.fillStyle='rgba(20,10,5,.85)';ctx.fillText(f.text,f.x+ox+1,f.y+oy+1);
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x+ox,f.y+oy);
  }
  ctx.globalAlpha=1;
  // 柔和暖光 / 暗角
  if(p){
    const px=p.x+ox,py=p.y+oy;
    const lg=ctx.createRadialGradient(px,py,10,px,py,300);
    lg.addColorStop(0,'rgba(255,203,132,.15)');lg.addColorStop(1,'rgba(255,203,132,0)');
    ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
  }
  const vg=ctx.createRadialGradient(W/2,H/2,130,W/2,H/2,450);
  vg.addColorStop(0,'rgba(28,15,7,0)');vg.addColorStop(1,'rgba(20,10,5,.34)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // 出口 / 目标指引
  if(G.scene==='dungeon'&&G.exitOpen&&m.exit){
    const x=m.exit.x+ox,y=m.exit.y+oy;
    ctx.fillStyle='rgba(163,225,124,'+(.4+Math.sin(G.time*4)*.2)+')';
    ctx.beginPath();ctx.arc(x,y-26,15,0,6.283);ctx.fill();
    ctx.fillStyle='#e8ffd0';ctx.font='bold 10px "Microsoft YaHei",sans-serif';
    ctx.fillText('出口',x,y-23);
  }
  if(G.scene==='city'&&m.portal){
    const x=m.portal.x+ox,y=m.portal.y+oy;
    ctx.strokeStyle='rgba(240,189,124,'+(.35+Math.sin(G.time*3)*.18)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,30,0,6.283);ctx.stroke();
  }
  bossBar();
  if(G.mode==='arena'){
    ctx.textAlign='center';ctx.font='bold 11px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#ffe0ab';ctx.fillText('⚔ 镜像竞技场 · 连胜 '+(p?p.streak:0)+' 轮',W/2,44);
  }
  if(G.flash>0){ctx.fillStyle='rgba(255,226,180,'+Math.min(.5,G.flash)+')';ctx.fillRect(0,0,W,H);}
}

function drawOrb(){
  const g=octx,c=48,r=35;g.clearRect(0,0,96,96);
  const p=G.player;if(!p)return;
  const hp=clamp(p.hp/p.stat.maxHp,0,1),mp=clamp(p.mp/p.stat.maxMp,0,1);
  // 外框
  g.fillStyle='rgba(30,18,11,.9)';g.beginPath();g.arc(c,c,45,0,6.283);g.fill();
  g.strokeStyle='#7a5940';g.lineWidth=2;g.beginPath();g.arc(c,c,44,0,6.283);g.stroke();
  g.strokeStyle='rgba(240,189,124,.25)';g.lineWidth=1;g.beginPath();g.arc(c,c,40,0,6.283);g.stroke();
  // 半环轨道：左红 / 右蓝
  g.lineCap='butt';g.lineWidth=9;
  g.strokeStyle='#4a2823';g.beginPath();g.arc(c,c,r,Math.PI/2,Math.PI*1.5);g.stroke();
  g.strokeStyle='#234050';g.beginPath();g.arc(c,c,r,-Math.PI/2,Math.PI/2);g.stroke();
  // 刻度
  g.lineWidth=1;g.strokeStyle='rgba(255,228,190,.32)';
  for(let i=0;i<=10;i++){
    const a1=Math.PI/2+Math.PI*i/10,a2=-Math.PI/2+Math.PI*i/10;
    for(const a of [a1,a2]){
      g.beginPath();g.moveTo(c+Math.cos(a)*(r-6),c+Math.sin(a)*(r-6));
      g.lineTo(c+Math.cos(a)*(r+6),c+Math.sin(a)*(r+6));g.stroke();
    }
  }
  // 血量（左，自下而上）/ 源能（右，自上而下）
  g.lineWidth=9;g.lineCap='round';
  if(hp>0){g.strokeStyle='#df5f57';g.shadowColor='rgba(223,95,87,.75)';g.shadowBlur=8;
    g.beginPath();g.arc(c,c,r,Math.PI/2,Math.PI/2+Math.PI*hp);g.stroke();
    g.strokeStyle='#f49a8c';g.lineWidth=3;g.beginPath();
    g.arc(c,c,r-2,Math.PI/2,Math.PI/2+Math.PI*hp);g.stroke();g.lineWidth=9;}
  if(mp>0){g.strokeStyle='#5fa9d8';g.shadowColor='rgba(95,169,216,.75)';
    g.beginPath();g.arc(c,c,r,-Math.PI/2,-Math.PI/2+Math.PI*mp);g.stroke();
    g.strokeStyle='#a6dcf5';g.lineWidth=3;g.beginPath();
    g.arc(c,c,r-2,-Math.PI/2,-Math.PI/2+Math.PI*mp);g.stroke();g.lineWidth=9;}
  g.shadowBlur=0;g.lineCap='butt';
  // 中心
  const lg=g.createRadialGradient(c-6,c-8,2,c,c,27);
  lg.addColorStop(0,'#5a3d29');lg.addColorStop(1,'#2a1b12');
  g.fillStyle=lg;g.beginPath();g.arc(c,c,26,0,6.283);g.fill();
  g.strokeStyle='#b08358';g.lineWidth=1.5;g.beginPath();g.arc(c,c,26,0,6.283);g.stroke();
  const cl=clsOf(p.cid);
  g.textAlign='center';g.fillStyle=cl.color;
  g.font='bold 19px "Microsoft YaHei",sans-serif';g.fillText(cl.icon,c,c+2);
  g.fillStyle='#ffe9c9';g.font='bold 9px Consolas,monospace';g.fillText('Lv.'+p.lv,c,c+15);
  // 左右小标
  g.font='9px "Microsoft YaHei",sans-serif';g.fillStyle='#f7a49a';g.fillText('血',14,c+3);
  g.fillStyle='#9ed4f0';g.fillText('能',82,c+3);
  if(p.buffs.shield>0){
    g.strokeStyle='rgba(127,214,196,.8)';g.lineWidth=2;
    g.beginPath();g.arc(c,c,31,0,6.283);g.stroke();
  }
  if(p.invuln>0&&Math.floor(G.time*16)%2){
    g.strokeStyle='rgba(255,240,200,.55)';g.lineWidth=2;
    g.beginPath();g.arc(c,c,42,0,6.283);g.stroke();
  }
}
function mapScale(w,h,mw,mh){const s=Math.min(w/mw,h/mh);return{s,ox:(w-mw*s)/2,oy:(h-mh*s)/2};}
function mapColors(v){
  return ({0:'#120c08',1:'#8a6747',2:'#6f5339',3:'#bd9a6e',4:'#7c9660',
    5:'#4f8a9e',6:'#8fc07a',7:'#c2623c',8:'#93775a',9:'#6f5339'})[v]||'#241a13';
}
function drawMinimap(){
  const g=mctx,m=G.map;g.clearRect(0,0,170,112);
  P(g,'#1a110b',0,0,170,112);
  if(!m||!G.player)return;
  const {s,ox,oy}=mapScale(168,110,m.w,m.h);
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){
    const v=m.tiles[y*m.w+x],seen=seenAt(x,y);
    P(g,seen?mapColors(v):'#100b08',ox+x*s,oy+y*s,Math.ceil(s),Math.ceil(s));
  }
  const px=(v)=>ox+v*s;
  if(m.type==='city'&&m.portal){g.fillStyle='#f0bd7c';g.beginPath();
    g.arc(px(m.portal.x/TILE),oy+m.portal.y/TILE*s,3,0,6.283);g.fill();}
  for(const n of (m.type==='city'?G.npcs:[])){
    g.fillStyle='#ffe0a0';g.fillRect(px(n.x/TILE)-1,oy+n.y/TILE*s-1,2,2);
  }
  if(m.type==='dungeon'&&m.exit){
    g.strokeStyle=G.exitOpen?'#a8e07c':'#71805c';g.lineWidth=1.5;
    g.beginPath();g.arc(px(m.exit.x/TILE),oy+m.exit.y/TILE*s,3.5,0,6.283);g.stroke();
  }
  for(const e of G.enemies){
    if(e.dead)continue;
    const c=e.boss?'#ff5f5f':(e.rival?'#f0bd7c':'#d9705f');
    g.fillStyle=c;g.beginPath();g.arc(px(e.x/TILE),oy+e.y/TILE*s,e.boss?3:1.6,0,6.283);g.fill();
  }
  // Boss 实时标识（脉冲红圈 + 箭头）
  if(G.boss&&!G.boss.dead){
    const bx=px(G.boss.x/TILE),by=oy+G.boss.y/TILE*s,pulse=2+Math.sin(G.time*5)*1.2;
    g.strokeStyle='#ff6b5f';g.lineWidth=1.5;
    g.beginPath();g.arc(bx,by,5+pulse,0,6.283);g.stroke();
    g.fillStyle='#ff8a72';g.beginPath();g.moveTo(bx,by-8);g.lineTo(bx-3,by-3);
    g.lineTo(bx+3,by-3);g.closePath();g.fill();
  }
  for(const k in NET.peers){
    const q=NET.peers[k];if(q.scene!==G.scene||q.floor!==G.floor)continue;
    g.fillStyle='#7fd6c4';g.fillRect(px((q.x||0)/TILE)-1,oy+(q.y||0)/TILE*s-1,3,3);
  }
  const p=G.player,dx=px(p.x/TILE),dy=oy+p.y/TILE*s;
  g.fillStyle='#fff6e2';g.beginPath();g.arc(dx,dy,2.6,0,6.283);g.fill();
  g.strokeStyle='rgba(255,240,200,.5)';g.lineWidth=1;g.beginPath();g.arc(dx,dy,5,0,6.283);g.stroke();
  $('zoneName').textContent=(m.name||'')+(G.scene==='dungeon'?' · 小地图':'');
}
function drawBigMap(){

    P(g,c,ox+x*s,oy+y*s,Math.ceil(s),Math.ceil(s));

      g.strokeRect(ox+r.x*s,oy+r.y*s,r.w*s,r.h*s);
    }
  }
  // Boss 实时标识
  if(G.boss&&!G.boss.dead){
    const bx=X(G.boss.x/TILE),by=Y(G.boss.y/TILE),pulse=6+Math.sin(G.time*5)*2;
    g.strokeStyle='#ff6b5f';g.lineWidth=2;
    g.beginPath();g.arc(bx,by,pulse,0,6.283);g.stroke();
    g.fillStyle='#ff7a66';g.beginPath();g.arc(bx,by,4,0,6.283);g.fill();
    g.fillStyle='#ffd0bb';g.font='bold 12px "Microsoft YaHei",sans-serif';

    g.fillText(Math.round(G.boss.hp)+' / '+Math.round(G.boss.maxHp)+
      ' · 距你 '+Math.round(dist(G.boss.x,G.boss.y,G.player.x,G.player.y)/TILE)+' 格',bx,by+20);
  }
  for(const k in NET.peers){
    const q=NET.peers[k];if(q.scene!==G.scene||q.floor!==G.floor)continue;
    g.fillStyle='#7fd6c4';g.beginPath();g.arc(X((q.x||0)/TILE),Y((q.y||0)/TILE),4,0,6.283);g.fill();
    g.fillStyle='#a8e8dc';g.fillText(q.n||'队友',X((q.x||0)/TILE),Y((q.y||0)/TILE)-8);
  }
  const p=G.player;

  g.fillStyle='#ffe9c9';g.font='bold 11px "Microsoft YaHei",sans-serif';
  g.fillText('你',X(p.x/TILE),Y(p.y/TILE)-13);
  // 图例
  g.textAlign='left';g.font='10px "Microsoft YaHei",sans-serif';

  g.fillStyle='#d9705f';g.fillText('● 敌人',168,ly);
  g.fillStyle='#a8e07c';g.fillText('● 出口',222,ly);
  g.fillStyle='#7fd6c4';g.fillText('● 房间队友',272,ly);
  g.fillStyle='#c4a78c';g.fillText('未探索区域为暗色 · 按 M 关闭',368,ly);

/* ---------- 技能栏 ---------- */
function buildSkillbar(){
  const box=$('skillbar');box.innerHTML='';
  const p=G.player;if(!p)return;
  const sks=SKILLS[p.cid]||SKILLS.warrior;
  for(let i=0;i<4;i++){
    const isUlt=i===3,sk=isUlt?(p.ult?ULTS[p.ult]:null):sks[i];
    const key=isUlt?'右键':sks[i].key;
    const icon=isUlt?(sk?sk.i:'✧'):sks[i].i;
    const nm=isUlt?(sk?sk.n:'未解锁奥义'):sks[i].n;
    const col=isUlt?ROUTES[p.route].color:(ELEM[sks[i].el]?ELEM[sks[i].el].c:'#f0bd7c');
    const tip=isUlt?(sk?'奥义 · 在技能树/路线点亮终极节点解锁':'在技能树或技能路线点亮终极节点解锁奥义'):
      sks[i].n+' ('+sks[i].key+') · '+sks[i].d+' 消耗 '+sks[i].cost+' 源能 / 冷却 '+sks[i].cd+'s';
    const d=document.createElement('div');
    d.className='slot';d.title=tip;d.setAttribute('data-act','cast');d.setAttribute('data-v',i);
    d.innerHTML='<span class="key">'+key+'</span><div class="ico" style="color:'+col+'">'+icon+'</div>'+
      '<div class="nm">'+nm+'</div><div class="cdmask" id="mask'+i+'"></div>'+
      '<div class="cdtxt" id="cdtxt'+i+'"></div>';
    box.appendChild(d);
  }
}
function updateSkillbar(){
  const p=G.player;if(!p)return;
  const keys=['q','e','r','ult'];
  if($('skillbar').children.length!==4)buildSkillbar();
  const sks=SKILLS[p.cid]||SKILLS.warrior;
  for(let i=0;i<4;i++){
    const cd=p.cd[keys[i]]||0,max=i<3?sks[i].cd*ROUTES[p.route].cdMul*(1-p.stat.cdr):
      (p.ult?ULTS[p.ult].cd*ROUTES[p.route].cdMul*(1-p.stat.cdr):1);
    const mask=$('mask'+i),txt=$('cdtxt'+i);if(!mask)continue;
    mask.style.height=clamp(cd/Math.max(.01,max),0,1)*100+'%';
    txt.textContent=cd>.1?cd.toFixed(1):'';
  }
}

  else{
    const left=G.enemies.filter(e=>!e.dead).length;

    '<div><span class="keycap">Q E R</span>技能 · <span class="keycap">空格</span>冲刺(行走方向) · <span class="keycap">1 2</span>药剂</div>'+
    '<div><span class="keycap">F</span>交互 · <span class="keycap">M</span>大地图 · <span class="keycap">N</span>房间 · <span class="keycap">Esc</span>暂停</div>';
  if(NET.room)bl+='<div style="color:#7fd6c4">⟡ 房间 '+NET.room+' · '+(Object.keys(NET.peers).length+1)+' 人</div>';
  $('hudBL').innerHTML=bl;
  const qb=[['char','角'],['bag','包'],['skill','技'],['fuse','融'],['map','图'],['lore','志'],['room','房'],['help','?']];
  $('quickBtns').innerHTML=qb.map(x=>'<div class="qbtn" data-act="panel" data-v="'+x[0]+'" title="打开'+x[0]+'面板">'+x[1]+'</div>').join('');
  const nb=$('netBadge');
  if(NET.room){
    nb.style.display='block';
    nb.textContent='⟡ 房间 '+NET.room+' · '+(NET.mode==='ws'?'跨设备中继':'本机多窗口')+
      ' · '+(Object.keys(NET.peers).length+1)+' 人在线'+(NET.connected?'':' · 连接中');
  }else nb.style.display='none';
  // 交互提示
  let hint='';
  if(G.scene==='city'){
    let near=null,bd=76;
    for(const n of G.npcs){const d=dist(p.x,p.y,n.x,n.y);if(d<bd){bd=d;near=n;}}
    if(near)hint='按 F 与 '+near.name+' 交谈';
    else if(m&&m.portal&&dist(p.x,p.y,m.portal.x,m.portal.y)<90)hint='按 F 打开迷宫传送门';
  }else if(G.scene==='dungeon'&&G.exitOpen&&m&&m.exit&&dist(p.x,p.y,m.exit.x,m.exit.y)<80){
    hint='按 F 进入第 '+(G.floor+1)+' 层';
  }
  $('hint').textContent=hint;

const PANEL_TABS=[['char','角色'],['bag','背包/商店'],['skill','技能树'],['fuse','融合转职'],
  ['map','大地图'],['floor','迷宫层数'],['arena','竞技场'],['lore','世界观'],['room','开房间联机'],['help','帮助']];
const PANEL_TITLE={char:'角色档案',bag:'背包与商店',skill:'技能树 · 技能路线 · 奥义',

const esc=s=>String(s===undefined?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function Gshop(){
  if(!G.shop||!G.shop.length||G.shopFloor!==G.floor){
    G.shopFloor=G.floor;G.shop=[];
    for(let i=0;i<4;i++){
      const it=rollItem(G.player?G.player.lv:1,RI(0,2));
      it.cost=Math.round(it.value*1.7+30);G.shop.push(it);
    }

function itemLine(it,act,label,extra){
  const af=it.affixes.map(a=>'<span class="dim">'+affixText(a)+'</span>').join(' · ');
  return '<div class="item"><div style="flex:1;min-width:0">'+
    '<b style="color:'+itemColor(it)+'">'+esc(it.name)+'</b> '+
    '<span class="tag" style="color:'+itemColor(it)+'">'+RARITY[it.rarity].n+'</span> '+
    '<span class="dim">'+SLOTS[it.slot]+' · Lv.'+it.lv+'</span>'+
    (it.plus?' <span class="gold">+'+it.plus+'</span>':'')+

    (extra||'')+'<button class="btn" data-act="'+act+'" data-v="'+it.id+'">'+label+'</button></div>';

function nodeLine(node,i,cur,act,v){
  const state=i<cur?'done':(i===cur?'can':'lock');
  const cost=!!(G.player&&G.player.tp>0);
  let st=i<cur?'<span style="color:#a3c979">已点亮</span>':
    (i===cur?(cost?'<span class="gold">消耗 1 技能点</span>':'<span class="dim">技能点不足</span>'):
    '<span class="dim">需先点亮前一节点</span>');
  return (i?'<div class="treeLine"></div>':'')+
    '<div class="node '+state+(node.ult?' ult':'')+'" '+(i===cur&&cost?'data-act="'+act+'" data-v="'+v+'"':'')+'>'+
    '<div class="nt">'+(node.ult?'✦ ':'◆ ')+esc(node.n)+'</div>'+
    '<div class="nd">'+esc(node.d)+'</div>'+
    '<div class="nl">'+(i+1)+'/4 '+st+'</div></div>';
}
function GplayerSafe(){return !!G.player;}
function openPanel(t){
  if(!PANEL_TITLE[t])return;
  if(!G.player&&['char','bag','skill','fuse','map','floor','arena'].indexOf(t)>=0){
    toast('请先开始游戏再打开此面板','#df8f7a');return;

function renderPanel(){
  if(!G.panel)return;

  G.form=form;

    '<div><span class="dim" style="font-size:10px;margin-right:10px">Esc / 点击右上角关闭</span>'+

    '<div class="panelBody">'+body+'</div>'+
    '<div class="panelFoot">源能斗士 II · 主城 / 迷宫闯关 / 融合转职 / 双分支技能树 / 房间联机 · 进度自动保存在本机</div>';

   ===================================================================== */
function addStat(k){
  const p=G.player;if(!p||p.sp<=0)return;
  p.stats[k]++;p.sp--;recalc(p);saveGame();renderPanel();updateHUD(true);
}
function setRoute(r){
  const p=G.player;if(!p||!ROUTES[r]||p.route===r)return;
  p.route=r;recalc(p);buildSkillbar();
  toast('源能路线切换为 <b style="color:'+ROUTES[r].color+'">'+ROUTES[r].name+'</b> · 冷却与技能表现已改变','#f0bd7c');
  saveGame();renderPanel();updateHUD(true);
}
function setUlt(k){
  const p=G.player;if(!p||!ULTS[k]||(p.ultList||[]).indexOf(k)<0)return;
  p.ult=k;buildSkillbar();toast('奥义已切换为 <b>'+ULTS[k].n+'</b>','#f0bd7c');
  saveGame();renderPanel();
}
function findItem(id){
  const p=G.player;id=Number(id);
  for(let i=0;i<p.bag.length;i++)if(p.bag[i].id===id)return {arr:p.bag,i,it:p.bag[i]};
  for(let i=0;i<(G.shop||[]).length;i++)if(G.shop[i].id===id)return {arr:G.shop,i,it:G.shop[i],shop:true};
  return null;
}
function equipItem(id){
  const p=G.player,f=findItem(id);if(!f||f.shop)return;
  const it=f.arr.splice(f.i,1)[0],old=p.equip[it.slot];
  p.equip[it.slot]=it;if(old)p.bag.push(old);
  recalc(p);toast('已装备 <b style="color:'+itemColor(it)+'">'+it.name+'</b>','#a3c979');
  saveGame();renderPanel();updateHUD(true);
}
function sellItem(id){
  const p=G.player,f=findItem(id);if(!f||f.shop)return;
  const g=Math.round(f.it.value*.6);f.arr.splice(f.i,1);p.gold+=g;
  toast('出售 '+f.it.name+' · +'+g+' G','#f2cd8c');saveGame();renderPanel();updateHUD(true);
}
function unequip(k){
  const p=G.player,it=p.equip[k];if(!it)return;
  p.equip[k]=null;p.bag.push(it);recalc(p);saveGame();renderPanel();updateHUD(true);
}
function buyPotion(t){
  const p=G.player,cost=t==='hp'?40:35;
  if(p.gold<cost){toast('金币不足','#df8f7a');return;}
  p.gold-=cost;p.potions[t]++;saveGame();renderPanel();updateHUD(true);
}
function buyItem(id){
  const p=G.player,f=findItem(id);if(!f||!f.shop)return;
  if(p.gold<f.it.cost){toast('金币不足','#df8f7a');return;}
  if(p.bag.length>=30){toast('背包已满','#df8f7a');return;}
  p.gold-=f.it.cost;f.arr.splice(f.i,1);p.bag.push(f.it);
  toast('购入 <b style="color:'+itemColor(f.it)+'">'+f.it.name+'</b>','#a3c979');
  saveGame();renderPanel();updateHUD(true);
}
function rerollShop(){
  const p=G.player;if(p.gold<20){toast('金币不足','#df8f7a');return;}
  p.gold-=20;G.shop=null;Gshop();saveGame();renderPanel();updateHUD(true);
}
function goFloor(f){
  f=clamp(Number(f)||1,1,50);
  closePanel();enterDungeon(f);updateHUD(true);drawMinimap();
}
function goCity(){closePanel();enterCity();updateHUD(true);drawMinimap();}
function startArenaGame(){closePanel();spawnArena();updateHUD(true);drawMinimap();}
function wipeAll(){
  wipeSave();if(NET.room)netLeave();
  closePanel();G.player=null;G.map=null;G.state='title';G.paused=false;
  G.enemies=[];G.projectiles=[];G.effects=[];G.drops=[];
  $('hud').classList.remove('on');$('titleScreen').classList.remove('hide');
  buildTitle();toast('存档已清除','#c4a78c');
}
function downloadServer(){
  const el=$('serverCode'),src=el?el.textContent.trim():'';
  if(!src){toast('服务端脚本未找到','#df8f7a');return;}
  try{
    const blob=new Blob([src],{type:'text/javascript;charset=utf-8'}),u=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=u;a.download='aether-server.js';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(u),1500);
    toast('已下载 <b>aether-server.js</b> · 运行 <span class="mono">node aether-server.js</span> 启动中继','#7fd6c4');
  }catch(e){toast('下载失败：'+e.message,'#df8f7a');}
}
document.addEventListener('click',e=>{
  const el=e.target&&e.target.closest?e.target.closest('[data-act]'):null;
  if(!el)return;
  const a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  try{
    if(a==='panel')openPanel(v);
    else if(a==='close')closePanel();
    else if(a==='cast'){if(+v<3)castSkill(+v);else castUlt();}
    else if(a==='stat')addStat(v);
    else if(a==='switch'){switchClass(v);renderPanel();updateHUD(true);}
    else if(a==='route')setRoute(v);
    else if(a==='tree'){buyTreeNode(v);renderPanel();updateHUD(true);}
    else if(a==='routenode'){buyRouteNode();renderPanel();updateHUD(true);}
    else if(a==='ult')setUlt(v);
    else if(a==='fuse'){doFuse(v);renderPanel();updateHUD(true);}
    else if(a==='equip')equipItem(v);
    else if(a==='sell')sellItem(v);
    else if(a==='unequip')unequip(v);
    else if(a==='buypotion')buyPotion(v);
    else if(a==='buyitem')buyItem(v);
    else if(a==='reroll')rerollShop();
    else if(a==='floor')goFloor(v);
    else if(a==='city')goCity();
    else if(a==='arena')startArenaGame();
    else if(a==='auto'){G.autoAtk=!G.autoAtk;toast('自动攻击已'+(G.autoAtk?'开启':'关闭'),'#a3c979');
      renderPanel();updateHUD(true);}
    else if(a==='wipe')wipeAll();
    else if(a==='pickclass'){G.classPick=v;buildTitle();}
    else if(a==='pickroute'){G.routePick=v;buildTitle();}
    else if(a==='room-create'){
      const codeEl=$('roomCode'),modeEl=$('netMode'),urlEl=$('netUrl');
      const code=netCode();
      netJoin(code,modeEl?modeEl.value:'local',urlEl?urlEl.value:NET.url);
      if(codeEl)codeEl.value=code;
    }
    else if(a==='room-join'){
      const codeEl=$('roomCode'),modeEl=$('netMode'),urlEl=$('netUrl');
      netJoin(codeEl?codeEl.value.trim():'',modeEl?modeEl.value:'local',urlEl?urlEl.value:NET.url);
    }
    else if(a==='room-leave')netLeave();
    else if(a==='chat-send'){const c=$('chatText');if(c){netSay(c.value);c.value='';}}
    else if(a==='server')downloadServer();
  }catch(err){toast('操作出错：'+err.message,'#df8f7a');}
});
/* ---------- 主循环 ---------- */
function update(dt){
  G.time+=dt;G.frameCount++;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*26);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*1.7);
  for(const f of G.floaters){f.life-=dt;f.y+=f.vy*dt;}
  G.floaters=G.floaters.filter(f=>f.life>0);
  for(const q of G.particles){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    q.vx*=1-dt*2.2;q.vy*=1-dt*2.2;}
  G.particles=G.particles.filter(q=>q.life>0);
  netTick(dt);
  G.hudTimer-=dt;G.miniTimer-=dt;
  if(G.state!=='play'||G.paused||G.panel||!G.player||!G.map)return;
  const p=G.player;
  // 移动
  let dx=0,dy=0;
  if(G.keys['a']||G.keys['arrowleft'])dx--;
  if(G.keys['d']||G.keys['arrowright'])dx++;
  if(G.keys['w']||G.keys['arrowup'])dy--;
  if(G.keys['s']||G.keys['arrowdown'])dy++;
  const len=Math.hypot(dx,dy);
  if(len){
    dx/=len;dy/=len;p.mdx=dx;p.mdy=dy;p.lastAngle=Math.atan2(dy,dx);
    if(dx)p.facing=dx>0?1:-1;
    const sp=p.stat.spd*92;
    moveEnt(p,dx*sp*dt,dy*sp*dt);p.walk+=dt*9;
  }else{p.mdx=0;p.mdy=0;p.walk+=dt*1.5;}
  if(G.mode==='arena'&&G.ARENA){
    const A=G.ARENA,dd=dist(p.x,p.y,A.x,A.y);
    if(dd>A.r-p.r){p.x=A.x+(p.x-A.x)/dd*(A.r-p.r);p.y=A.y+(p.y-A.y)/dd*(A.r-p.r);}
  }
  // 冷却 / 回复 / buff
  for(const k in p.cd)if(p.cd[k]>0)p.cd[k]=Math.max(0,p.cd[k]-dt);
  p.mp=Math.min(p.stat.maxMp,p.mp+p.stat.mpRegen*dt);
  for(const k in p.buffs)if(p.buffs[k]>0&&k!=='shield')p.buffs[k]=Math.max(0,p.buffs[k]-dt);
  if(p.invuln>0)p.invuln=Math.max(0,p.invuln-dt);
  p.playTime=(p.playTime||0)+dt;
  // 自动攻击（远程索敌 / 近战范围挥击）
  if((G.mouse.left||G.autoAtk)&&p.cd.atk<=0){
    if(G.mouse.left||autoTarget(p.stat.range+70))basicAttack();
  }
  updateEnemies(dt);updateProjectiles(dt);updateEffects(dt);updateDrops(dt);
  if(G.arenaWinPending){G.arenaWinPending=false;leaveArena(true);return;}
  revealFog();
  // 镜头
  const tcx=clamp(p.x-W/2,0,Math.max(0,G.map.w*TILE-W)),
        tcy=clamp(p.y-H/2,0,Math.max(0,G.map.h*TILE-H));
  const k=Math.min(1,dt*9);
  G.cam.x=lerp(G.cam.x,tcx,k);G.cam.y=lerp(G.cam.y,tcy,k);
  // 定时
  G.saveTimer+=dt;if(G.saveTimer>18){G.saveTimer=0;saveGame();}
  if(G.miniTimer<=0){G.miniTimer=.18;drawMinimap();if(G.panel==='map')drawBigMap();}
}
let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs)lastTs=ts;
  const dt=clamp((ts-lastTs)/1000,0,.05);lastTs=ts;
  update(dt);render();
  if(G.state==='play')updateHUD(false);
}
/* ---------- 标题 ---------- */
function buildTitle(){
  $('classPick').innerHTML=CLASSES.map(c=>
    '<div class="classCard '+(G.classPick===c.id?'on':'')+'" data-act="pickclass" data-v="'+c.id+'">'+
    '<div class="ci">'+c.icon+'</div><div class="cn" style="color:'+c.color+'">'+c.name+'</div>'+
    '<div class="ct">'+c.en+' · '+c.tag+'</div><div class="cd">'+c.desc+'</div></div>').join('');
  $('routePick').innerHTML=Object.keys(ROUTES).map(k=>{
    const r=ROUTES[k];
    return '<div class="routeCard '+(G.routePick===k?'on':'')+'" data-act="pickroute" data-v="'+k+'">'+
      '<div class="ri" style="color:'+r.color+'">'+r.icon+'</div><div>'+
      '<div class="rn" style="color:'+r.color+'">'+r.name+'路线 <span class="dim" style="font-size:9px">'+r.en+'</span></div>'+
      '<div class="rd">'+r.desc+'</div></div></div>';
  }).join('');
  $('continueBtn').style.display=hasSave()?'inline-block':'none';
}
function fitStage(){
  const s=Math.min(window.innerWidth/960,window.innerHeight/600,1);
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize',fitStage);
$('startBtn').addEventListener('click',()=>newGame(G.classPick,G.routePick,null,0));
$('continueBtn').addEventListener('click',()=>{
  const d=loadGame();
  if(d)newGame(d.p.cid,d.p.route,d.p,d.floor);
  else toast('没有可用存档','#df8f7a');
});
$('loreBtn').addEventListener('click',()=>openPanel('lore'));
$('roomBtn').addEventListener('click',()=>openPanel('room'));
$('reviveBtn').addEventListener('click',revive);
canvas.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
G.autoAtk=true;
fitStage();buildTitle();render();
requestAnimationFrame(loop);
</script>
